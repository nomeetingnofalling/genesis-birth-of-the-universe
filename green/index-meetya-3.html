<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Слова — точечная сетка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.13/p5.min.js" defer></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e0f12;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #8a8f99;
      font: 13px/1.2 'PT Mono', monospace;
    }
    /* Панель управления теперь не в потоке (см. #controls ниже), поэтому
       сцена одна в body и занимает весь экран, сохраняя пропорции 16:9. */
    #stage {
      flex: 1 1 0;
      min-height: 0;
      max-width: 100%;
      aspect-ratio: 16 / 9;
    }
    /* Панель управления больше не стоит в потоке под сценой — она выезжает
       слева поверх неё, чтобы во время показа сцена занимала весь экран,
       а настройки доставались одним нажатием кнопки в углу. */
    #controlsToggle {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 21;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14161b;
      border: 1px solid #2c2f38;
      border-radius: 6px;
      color: #e6e8ee;
      font: 16px/1 'PT Mono', monospace;
      cursor: pointer;
    }
    #controlsToggle:hover {
      border-color: #ff7a50;
      color: #ff7a50;
    }
    #controls {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      height: 100%;
      width: min(84vw, 300px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 22px;
      padding: 60px 16px 16px;
      background: rgba(14, 15, 18, 0.2);   /* прозрачность 80% по просьбе */
      border-right: 1px solid #22242b;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    #controls.open {
      transform: translateX(0);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .group-title {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5a5f69;
    }
    .group-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }
    .group-body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }
    .chaos-frame {
      margin-top: auto;
      padding: 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chaos-btn {
      background: linear-gradient(180deg, #ff9a3d, #ff7a10);
      border: 1px solid #a8480a;
      border-radius: 6px;
      color: #2a1400;
      font: 700 13px/1.2 'PT Mono', monospace;
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 3px 0 #9a3f08, 0 5px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transform: translateY(0);
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease, color 0.15s ease;
    }
    .chaos-btn:hover {
      background: linear-gradient(180deg, #ffe066, #ffcc00);
      border-color: #cc9900;
      color: #2a2000;
    }
    .chaos-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #9a3f08, inset 0 2px 5px rgba(0, 0, 0, 0.4);
    }
    .mic-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #14161b;
      border: 1px solid #2c2f38;
      border-radius: 6px;
      color: #8a8f99;
      font: 13px/1.2 'PT Mono', monospace;
      padding: 9px 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .mic-toggle:hover {
      border-color: #ff7a50;
      color: #e6e8ee;
    }
    .mic-toggle-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #3a3d45;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    /* .live отражает не нажатие кнопки, а то, что микрофон и правда сейчас
       слушает (поток получен браузером) — по этой точке видно фактическое
       использование, а не только желание пользователя его включить. */
    .mic-toggle.live .mic-toggle-dot {
      background: #ff7a50;
      box-shadow: 0 0 8px 2px rgba(255, 122, 80, 0.65);
    }
    #controls label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    #controls input[type="range"] {
      flex: 1 1 120px;
      min-width: 90px;
      width: auto;
      accent-color: #ff7a50;
    }
    #controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff7a50;
      cursor: pointer;
    }
    .control-value {
      display: inline-block;
      min-width: 2.6em;
      color: #ff7a50;
      font-variant-numeric: tabular-nums;
    }
    #controls .hsb-control {
      gap: 9px;
    }
    .hsb-wheel {
      position: relative;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      cursor: crosshair;
      touch-action: none;
      background:
        radial-gradient(circle, #e6e8ee 0 0, transparent 70%),
        conic-gradient(#ff5050, #ff7a50, #ffe650, #58e878, #55dfff, #5aa9ff, #bd72ff, #ff5aa8, #ff5050);
    }
    .hsb-wheel::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, #e6e8ee 0, transparent 10%, transparent 100%);
      pointer-events: none;
    }
    .hsb-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid #e6e8ee;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #0e0f12;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Слова, собранные в строгую сетку и превращающиеся в точки"></main>
  <button id="controlsToggle" type="button" aria-label="Показать или скрыть панель управления">☰</button>

  <div id="controls">
    <div class="control-group">
      <div class="group-title">жизнь</div>
      <div class="group-body">
        <div class="group-row" id="vizGroup">
          <label>плотность точек
            <input id="density" type="range" min="0" max="100" value="60" />
            <span class="control-value" id="densityValue">60</span>
          </label>
          <label>скорость движения
            <input id="speed" type="range" min="0" max="200" value="100" />
            <span class="control-value" id="speedValue">100</span>
          </label>
          <label>вихрь
            <input id="vortex" type="range" min="0" max="100" value="100" />
            <span class="control-value" id="vortexValue">100</span>
          </label>
          <label>сфера
            <input id="sphere" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="sphereValue">0</span>
          </label>
          <label>удаленность
            <input id="distance" type="range" min="0" max="100" value="100" />
            <span class="control-value" id="distanceValue">100</span>
          </label>
          <label>связность
            <input id="cohesion" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="cohesionValue">0</span>
          </label>
          <label>количество линий
            <input id="links" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="linksValue">0</span>
          </label>
          <label>свечение
            <input id="glow" type="range" min="0" max="100" value="45" />
            <span class="control-value" id="glowValue">45</span>
          </label>
          <label>шлейф
            <input id="trail" type="range" min="0" max="100" value="80" />
            <span class="control-value" id="trailValue">80</span>
          </label>
          <label class="hsb-control">HSB облака
            <span id="hsbWheel" class="hsb-wheel" role="slider" aria-label="Оттенок и насыщенность облака точек">
              <span id="hsbDot" class="hsb-dot"></span>
            </span>
          </label>
        </div>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">звёзды</div>
      <div class="group-row">
        <label>скорость звёзд
          <input id="starSpeed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starSpeedValue">0</span>
        </label>
        <label>контраст звёзд
          <input id="starContrast" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starContrastValue">0</span>
        </label>
        <label>яркость звёзд
          <input id="starBrightness" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starBrightnessValue">0</span>
        </label>
        <label>вращение звёзд
          <input id="starSpin" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starSpinValue">0</span>
        </label>
        <label>движение вперёд
          <input id="starForward" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starForwardValue">0</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">синяя планета</div>
      <div class="group-row">
        <label>масса планеты
          <input id="planetMass" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planetMassValue">0</span>
        </label>
        <label>скорость вращения
          <input id="planetSpeed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planetSpeedValue">0</span>
        </label>
        <label>орбита
          <input id="planetDistance" type="range" min="0" max="100" value="80" />
          <span class="control-value" id="planetDistanceValue">80</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">красная планета</div>
      <div class="group-row">
        <label>масса планеты
          <input id="planet2Mass" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planet2MassValue">0</span>
        </label>
        <label>скорость вращения
          <input id="planet2Speed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planet2SpeedValue">0</span>
        </label>
        <label>орбита
          <input id="planet2Distance" type="range" min="0" max="100" value="80" />
          <span class="control-value" id="planet2DistanceValue">80</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">точка вращения</div>
      <div class="group-row">
        <label>притяжение
          <input id="sunAttraction" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="sunAttractionValue">0</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">звук</div>
      <div class="group-row">
        <button id="soundToggle" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="soundToggleLabel">звук: выкл</span>
        </button>
        <label>громкость
          <input id="volume" type="range" min="0" max="100" value="50" />
          <span class="control-value" id="volumeValue" data-suffix="%">50%</span>
        </label>
        <label>частота
          <input id="frequency" type="range" min="0" max="100" value="15" />
          <span class="control-value" id="frequencyValue" data-suffix="%">15%</span>
        </label>
        <label>дилей
          <input id="delay" type="range" min="0" max="100" value="60" />
          <span class="control-value" id="delayValue" data-suffix="%">60%</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">присутствие</div>
      <div class="group-row">
        <label>чувствительность
          <input id="presence" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="presenceValue">0</span>
        </label>
        <button id="presenceToggle" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="presenceToggleLabel">микрофон: выкл</span>
        </button>
      </div>
    </div>
    <div class="chaos-frame">
      <button id="chaosBtn" type="button" class="chaos-btn">Хаос</button>
    </div>
  </div>

  <script>

      'милосердие', 'душа', 'признательность', 'преданность', 'чувство'

    const PALETTE = {
      background: '#0e0f12',
      light: '#e6e8ee',
      muted: '#8a8f99',
      orange: '#ff7a50',
      blue: '#5aa9ff'
    };

    // Вступление: слово «любовь» весь этот путь плавно растворяется, а
    // свечение от него растёт — и из этого свечения рождаются точки слов
    // (те самые, в которые раньше рассыпались 100 слов). Это одно общее,
    // медленное движение на протяжении целой минуты — сетка слов больше не
    // показывается как читаемый текст вовсе, только точками.
    const INTRO_MS = 60000;
    const WORD_DISSOLVE_SPEEDUP = 2; // буква «А» тает вдвое быстрее общего минутного хода
    const INTRO_GLOW_BASE = 70;     // радиус свечения и буквы на экране в начале, px
    const INTRO_START_ALPHA = 0.85; // буква и свечение на старте уже на 15% прозрачны
    // Буква «А» — вырезанный заранее из картинки тигла (offline, вручную
    // проверенным вырезом) прозрачный PNG — тигл_буква.png, встроен тут же
    // как base64. Фона-картинки вокруг неё больше нет — вместо тигла
    // свечение из 5 цветов палитры, генерируется прямо здесь (см.
    // GLOW_COLORS, sampleGlowColor() и drawIntro()).
    // Порядок стоп-цветов от центра свечения к краю — по образцу присланного
    // фото тигла: синий, зелёный, белый, красный, жёлтый. «Синий» и «белый»
    // — те же PALETTE.blue и PALETTE.light. «Зелёный», «красный» и «жёлтый»
    // в основной палитре отсутствуют — исключение из правила пяти цветов,
    // осознанное: пользователь сам назвал эти цвета именно для этого
    // свечения.
    const GLOW_COLORS = [PALETTE.blue, '#2ecc8f', PALETTE.light, '#ff5c5c', '#ffd166'];

    // Интерполирует по GLOW_COLORS: t=0 — центр свечения, t=1 — край.
    function sampleGlowColor(t) {
      const clamped = constrain(t, 0, 1);
      const scaled = clamped * (GLOW_COLORS.length - 1);
      const idx = Math.min(GLOW_COLORS.length - 2, Math.floor(scaled));
      const localT = scaled - idx;
      return lerpColor(color(GLOW_COLORS[idx]), color(GLOW_COLORS[idx + 1]), localT);

    const STAR_FIELD_SPREAD = 900;      // разброс звёзд по x/y на дальней границе
    const STAR_NEAR_Z = 30;             // ближе этого звезда «пролетела» — её пересевают вдаль
    const STAR_FAR_Z = 1700;            // дальняя граница, где рождаются новые звёзды
    const STAR_FLIGHT_SPEED = 900;      // скорость полёта сквозь звёздное поле, условных единиц/с
    // У каждой звезды свой множитель скорости в этих пределах — без него
    // все звёзды шли бы строго в ногу и читались бы как летящие группами,
    // единым строем, а не вразнобой.
    const STAR_SPEED_MUL_MIN = 0.5;
    const STAR_SPEED_MUL_MAX = 1.8;
    const STAR_SPIN_MAX_SPEED = ((2 * Math.PI) / 15) * 10; // скорость вращения поля звёзд вокруг оси полёта на 100%, рад/с — Math.PI, не TWO_PI: этот файл исполняется до того, как p5 определит свои глобальные константы
    const STAR_TAIL_STRETCH = 3;        // во сколько раз хвост звезды длиннее её смещения за один кадр
    const COLLIDE_DIST = DOT_SIZE;       // центры ближе этого — точки касаются
    const COLLIDE_CELL = DOT_SIZE * 4;   // ячейка сетки поиска соседних точек
    const FLASH_MS = 100;                // вспышка при столкновении держится 0,1с
    const CHIME_VOICES = 8;              // столько «хрустальных» голосов может звучать разом
    const CHIME_MIN_GAP_MS = 90;         // не даёт вспышкам столкновений слиться в шум
    const CHIME_FREQ_AT_0 = 100;         // ползунок «частота» на 0
    const CHIME_FREQ_AT_100 = 800;       // ползунок «частота» на 100%
    const CHIME_PARTIAL_MIN = 1.004;     // второй тон почти в унисон с первым — так рождается
    const CHIME_PARTIAL_MAX = 1.012;     // медленное биение, «пение» бокала, а не бряцание металла
    const CHIME_ATTACK = 0.006;          // мягкий, но быстрый удар — не щелчок и не нарастание
    const CHIME_DECAY = 0.55;            // долгое, тающее пение, как у настоящего хрусталя
    const CHIME_PEAK = 0.07;             // тихо — фоновый отблеск звука, а не акцент
    const CHIME_PARTIAL_GAIN = 0.85;     // почти равен основному тону — иначе биения не слышно
    const CHIME_THIRD_RATIO = Math.pow(2, -4 / 12); // большая терция вниз (12-тон. равномерный строй)
    const CHIME_THIRD_GAIN = 0.7;        // тише основного тона — подголосок, а не дублёр
    const CHIME_FOURTH_RATIO = Math.pow(2, -2 / 12); // ещё целый тон вниз — уже от третьего тона
    const CHIME_FOURTH_GAIN = 0.55;      // самый тихий и самый низкий голос в звоне
    const CHIME_FIFTH_RATIO = Math.pow(2, 7 / 12);   // чистая квинта вверх от основного тона — достраивает аккорд
    const CHIME_FIFTH_GAIN = 0.5;        // тише основного тона, добавляет объём сверху
    const CHIME_OCTAVE_RATIO = 2;        // октава вверх от основного тона — завершает звучание аккорда
    const CHIME_OCTAVE_GAIN = 0.35;      // самый тихий и самый высокий голос в аккорде

    let introWord = 'любовь';   // слово вступления — читается из слова1.txt, по умолчанию «любовь»
    let introFontSize = 0;
    let introGlyphImg = null;   // вырезанная буква «А» (тигл_буква.png), прозрачный фон
    let introGlyphReady = false;
    let introGlyphLayer = null; // готовый слой для отрисовки — см. buildIntroLayers()
    let loadedWords = [];
    let words = [];
    let pieces = [];
    let startedAt = 0;
    let shatterTriggered = false;
    let field = null;
    let fieldGain = 0;
    let activePoints = [];
    let liveScratch = [];
    let linkGrid = new Map();
    let collideGrid = new Map();
    let nextPointId = 0;
    let audioCtx = null;
    let chimeVoices = [];
    let nextChimeVoice = 0;
    let lastChimeAt = -Infinity;
    let audioReady = false;
    let densityInput = null;
    let speedInput = null;
    let vortexInput = null;
    let sphereInput = null;
    let distanceInput = null;
    let cohesionInput = null;
    let linksInput = null;
    let glowInput = null;
    let trailInput = null;
    let presenceInput = null;
    let volumeInput = null;
    let frequencyInput = null;
    let soundOutputEnabled = false;   // тумблер «звук вкл/выкл» — того же вида, что у микрофона
    let soundToggleBtn = null;
    let soundToggleLabel = null;
    let delayInput = null;
    let delayNode = null;
    let delayFeedback = null;
    let delayWet = null;
    // Микрофон как вход, камеры в проекте больше нет вообще. На нуле
    // микрофон не запрашивается и не слушается. Выше нуля громкость звука
    // раскачивает движение частиц: тише — спокойнее путь, громче — шире
    // взмах, и у каждой частицы этот взмах идёт по своей фазе, а не разом.
    let micStream = null;
    let micSource = null;
    let analyser = null;
    let micData = null;
    let micReady = false;
    let micRequesting = false;
    let soundLevel = 0;     // сглаженная громкость микрофона, 0..1
    let presenceDrive = 0;  // 0 — колебаний нет, 1 — раскачка на полную
    // Значок присутствия: маленькая контурная фигура в правом нижнем углу.
    // Раньше части загорались по зонам кадра камеры, теперь все они
    // реагируют на одну и ту же громкость, но с разной инерцией — оттого
    // фигура «дышит» неровно, а не мигает разом.
    const zones = { head: 0, torso: 0, left: 0, right: 0 };
    let presenceAt = 0;
    let presenceEnabled = false;    // тумблер «микрофон вкл/выкл» — отдельный от ползунка чувствительности
    let presenceToggleBtn = null;
    let presenceToggleLabel = null;
    let planetMassInput = null;
    let planetSpeedInput = null;
    let planetDistanceInput = null;
    let planetAngle = 0;
    let planetAt = 0;
    let planetX = 0;
    let planetY = 0;
    let planetMassRatio = 1;
    let planetDistanceRatio = 1;
    let planetRadiusPx = PLANET_RADIUS_MIN;
    let planet2MassInput = null;
    let planet2SpeedInput = null;
    let planet2DistanceInput = null;
    let planet2Angle = 0;
    let planet2At = 0;
    let planet2X = 0;
    let planet2Y = 0;
    let planet2MassRatio = 1;
    let planet2DistanceRatio = 1;
    let planet2RadiusPx = PLANET_RADIUS_MIN;
    let sunAttractionInput = null;
    let sunMassRatio = 0;
    let sphereRadiusPx = 0;  // радиус «сферы» задаёт ползунок «сфера» — считается в draw()
    let sunRadiusPx = SUN_RADIUS_MIN;
    let planetDepthZ = 0;
    let planetScale = 1;
    let planet2DepthZ = 0;
    let planet2Scale = 1;
    let stars = [];
    let starsAt = 0;
    let starSpeedInput = null;
    let starContrastInput = null;
    let starBrightnessInput = null;
    let starSpinInput = null;
    let starForwardInput = null;
    let starSpinAngle = 0;
    let cloudHue = 17;
    let cloudSaturation = 68;
    let placeHsbDot = null;

    function preload() {
      // Буква «А» грузится независимо от способа открытия страницы —
      // в отличие от текстовых файлов ниже, встроенная как base64 картинка
      // доступна и при открытии файла двойным кликом (file://).
      try {

      }

      if (window.location.protocol === 'file:') {
        loadedWords = FALLBACK_WORDS.slice();

      }

      // Вступительное слово («любовь» по умолчанию) — отдельный файл,
      // отдельная переменная, к сетке слов отношения не имеет.
      try {
        loadStrings(
          'слова1.txt',
          lines => {
            const trimmed = (lines || []).map(line => line.trim()).filter(Boolean);
            if (trimmed.length) introWord = trimmed[0];
          },
          () => {}

      } catch (err) {

      }

      try {
        loadedWords = loadStrings(
          'слова2.txt',
          lines => { loadedWords = lines; },
          () => { loadedWords = FALLBACK_WORDS.slice(); }
        );

        loadedWords = FALLBACK_WORDS.slice();
      }
    }

    function setup() {
      const canvas = createCanvas(1280, 720);
      canvas.parent('stage');
      pixelDensity(1);
      frameRate(30);
      randomSeed(7);
      noiseSeed(7);
      textFont('PT Mono');
