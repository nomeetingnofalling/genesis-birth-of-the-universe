      words = (loadedWords && loadedWords.length ? loadedWords : FALLBACK_WORDS)
        .map(line => line.trim())
        .filter(Boolean);

      buildIntroLayers();
      buildGrid();
      introFontSize = fitTextSize(introWord, width * 0.82, 150) / 4;
      buildField();
      buildStars();
      densityInput = document.getElementById('density');
      speedInput = document.getElementById('speed');
      vortexInput = document.getElementById('vortex');
      sphereInput = document.getElementById('sphere');
      distanceInput = document.getElementById('distance');
      cohesionInput = document.getElementById('cohesion');
      linksInput = document.getElementById('links');
      glowInput = document.getElementById('glow');
      trailInput = document.getElementById('trail');
      starSpeedInput = document.getElementById('starSpeed');
      starContrastInput = document.getElementById('starContrast');
      starBrightnessInput = document.getElementById('starBrightness');
      starSpinInput = document.getElementById('starSpin');
      starForwardInput = document.getElementById('starForward');
      presenceInput = document.getElementById('presence');
      volumeInput = document.getElementById('volume');
      frequencyInput = document.getElementById('frequency');
      soundToggleBtn = document.getElementById('soundToggle');
      soundToggleLabel = document.getElementById('soundToggleLabel');
      delayInput = document.getElementById('delay');
      planetMassInput = document.getElementById('planetMass');
      planetSpeedInput = document.getElementById('planetSpeed');
      planetDistanceInput = document.getElementById('planetDistance');
      planet2MassInput = document.getElementById('planet2Mass');
      planet2SpeedInput = document.getElementById('planet2Speed');
      planet2DistanceInput = document.getElementById('planet2Distance');
      sunAttractionInput = document.getElementById('sunAttraction');
      presenceToggleBtn = document.getElementById('presenceToggle');
      presenceToggleLabel = document.getElementById('presenceToggleLabel');
      setupHsbWheel();
      setupChaosButton();
      setupControlsPanel();
      setupPresenceToggle();
      setupSoundToggle();
      setupChimeVoices();
      window.addEventListener('pointerdown', unlockAudioOnce);
      window.addEventListener('keydown', unlockAudioOnce);
      startedAt = millis();
    }

    // Голосовой пул для звона стекла при столкновениях — на чистом Web
    // Audio API, без p5.sound: осцилляторы и gain-узлы не требуют никаких
    // AudioWorklet-модулей, поэтому спокойно работают и при открытии файла
    // двойным кликом (file://), где загрузка worklet-скриптов через blob
    // браузером запрещена. Несколько голосов крутятся всё время на нулевой
    // громкости и переиспользуются по кругу — короткие звоны не создают
    // новые узлы на каждое столкновение, а просто перезапускают готовый.
    function setupChimeVoices() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();

        // Общая шина delay: часть звона уходит в задержку, зацикливается
        // сама на себя (затухающее эхо) и возвращается в общий выход —
        // сила эффекта целиком регулируется ползунком «дилей».
        delayNode = audioCtx.createDelay(1.0);
        delayNode.delayTime.value = 0.26;
        delayFeedback = audioCtx.createGain();
        delayFeedback.gain.value = 0;
        delayWet = audioCtx.createGain();
        delayWet.gain.value = 0;
        delayNode.connect(delayFeedback).connect(delayNode);
        delayNode.connect(delayWet).connect(audioCtx.destination);

        for (let i = 0; i < CHIME_VOICES; i++) {
          const tone = audioCtx.createOscillator();
          const tonePartial = audioCtx.createOscillator();
          const toneThird = audioCtx.createOscillator();
          const toneFourth = audioCtx.createOscillator();
          const toneFifth = audioCtx.createOscillator();
          const toneOctave = audioCtx.createOscillator();
          const toneGain = audioCtx.createGain();
          const partialGain = audioCtx.createGain();
          const thirdGain = audioCtx.createGain();
          const fourthGain = audioCtx.createGain();
          const fifthGain = audioCtx.createGain();
          const octaveGain = audioCtx.createGain();
          tone.type = 'sine';
          tonePartial.type = 'sine';
          toneThird.type = 'sine';
          toneFourth.type = 'sine';
          toneFifth.type = 'sine';
          toneOctave.type = 'sine';
          toneGain.gain.value = 0;
          partialGain.gain.value = 0;
          thirdGain.gain.value = 0;
          fourthGain.gain.value = 0;
          fifthGain.gain.value = 0;
          octaveGain.gain.value = 0;
          tone.connect(toneGain).connect(audioCtx.destination);
          tonePartial.connect(partialGain).connect(audioCtx.destination);
          toneThird.connect(thirdGain).connect(audioCtx.destination);
          toneFourth.connect(fourthGain).connect(audioCtx.destination);
          toneFifth.connect(fifthGain).connect(audioCtx.destination);
          toneOctave.connect(octaveGain).connect(audioCtx.destination);
          toneGain.connect(delayNode);
          partialGain.connect(delayNode);
          thirdGain.connect(delayNode);
          fourthGain.connect(delayNode);
          fifthGain.connect(delayNode);
          octaveGain.connect(delayNode);
          tone.start();
          tonePartial.start();
          toneThird.start();
          toneFourth.start();
          toneFifth.start();
          toneOctave.start();
          chimeVoices.push({
            tone, partial: tonePartial, third: toneThird, fourth: toneFourth, fifth: toneFifth, octave: toneOctave,
            toneGain, partialGain, thirdGain, fourthGain, fifthGain, octaveGain
          });
        }
      } catch (err) {
        chimeVoices = [];
      }
    }

    // Браузер не даёт звуку играть без жеста пользователя — ловим первый
    // клик или нажатие клавиши где угодно на странице и один раз включаем
    // звук через него, без всякой подсказки на экране.
    function unlockAudioOnce() {
      window.removeEventListener('pointerdown', unlockAudioOnce);
      window.removeEventListener('keydown', unlockAudioOnce);
      try {
        if (audioCtx) audioCtx.resume().then(() => {
          audioReady = true;
          updateSoundToggleUI();
        });
      } catch (err) {
        // звук недоступен — на картинку это никак не влияет
      }
    }

    // Точное затухание амплитуды одного тона: атака и спад планируются
    // напрямую через Web Audio, а не плавным .value=, чтобы момент удара
    // был резким («тинь»), а не смазанным плавным нарастанием.
    function ringChimeGain(gainParam, peak, now) {
      gainParam.cancelScheduledValues(now);
      gainParam.setValueAtTime(gainParam.value, now);
      gainParam.linearRampToValueAtTime(peak, now + CHIME_ATTACK);
      gainParam.linearRampToValueAtTime(0, now + CHIME_ATTACK + CHIME_DECAY);
    }

    // Один тихий звон хрустального бокала: два почти совпадающих по высоте
    // тона (как два собственных колебания стенки бокала) медленно бьются
    // друг о друга — это и слышно как «пение» стекла, а не как удар, плюс
    // третий, более тихий тон на большую терцию ниже — подголосок, который
    // делает звон объёмнее. Все тона высоко в регистре, но негромкие, и
    // тают несколько сотен миллисекунд. Голос берётся из пула по кругу.
    function triggerGlassChime(strength) {
      if (!soundOutputEnabled) return;
      if (!audioReady || !chimeVoices.length) return;
      try {
        const voice = chimeVoices[nextChimeVoice];
        nextChimeVoice = (nextChimeVoice + 1) % chimeVoices.length;

        const freqPos = readControl(frequencyInput, 15) / 100;
        const baseFreq = CHIME_FREQ_AT_0 * Math.pow(CHIME_FREQ_AT_100 / CHIME_FREQ_AT_0, freqPos);
        const ratio = random(CHIME_PARTIAL_MIN, CHIME_PARTIAL_MAX);
        const now = audioCtx.currentTime;
        voice.tone.frequency.setValueAtTime(baseFreq, now);
        voice.partial.frequency.setValueAtTime(baseFreq * ratio, now);
        const thirdFreq = baseFreq * CHIME_THIRD_RATIO;
        voice.third.frequency.setValueAtTime(thirdFreq, now);
        voice.fourth.frequency.setValueAtTime(thirdFreq * CHIME_FOURTH_RATIO, now);
        voice.fifth.frequency.setValueAtTime(baseFreq * CHIME_FIFTH_RATIO, now);
        voice.octave.frequency.setValueAtTime(baseFreq * CHIME_OCTAVE_RATIO, now);

        const loud = constrain(strength / 2.2, 0.14, 1);
        const volume = readControl(volumeInput, 50) / 100;
        const peak = CHIME_PEAK * loud * volume;
        ringChimeGain(voice.toneGain.gain, peak, now);
        ringChimeGain(voice.partialGain.gain, peak * CHIME_PARTIAL_GAIN, now);
        ringChimeGain(voice.thirdGain.gain, peak * CHIME_THIRD_GAIN, now);
        ringChimeGain(voice.fourthGain.gain, peak * CHIME_FOURTH_GAIN, now);
        ringChimeGain(voice.fifthGain.gain, peak * CHIME_FIFTH_GAIN, now);
        ringChimeGain(voice.octaveGain.gain, peak * CHIME_OCTAVE_GAIN, now);

        if (delayWet && delayFeedback) {
          const delayAmount = readControl(delayInput, 0) / 100;
          delayWet.gain.setValueAtTime(delayAmount * 0.5, now);
          delayFeedback.gain.setValueAtTime(delayAmount > 0 ? 0.2 + delayAmount * 0.25 : 0, now);
        }
      } catch (err) {
        // звук — необязательная надстройка, её сбой не должен ронять анимацию
      }
    }

    function buildGrid() {
      pieces = [];
      const rows = Math.ceil(words.length / COLS);
      const cellW = width / COLS;
      const cellH = height / rows;

      words.forEach((label, index) => {
        const col = index % COLS;
        const row = Math.floor(index / COLS);
        const cx = col * cellW + cellW / 2;
        const cy = row * cellH + cellH / 2;
        const fontSize = fitTextSize(label, cellW - 24, Math.min(56, cellH * 0.62));
        const colorName = index % 13 === 4 ? 'orange' : index % 11 === 2 ? 'blue' : 'light';
        const points = sampleWord(label, fontSize, cellW - 18, cellH - 12);

        // Точка навсегда помнит слово, из которого возникла: индекс и текст
        // слова записаны один раз при рождении и больше нигде не меняются,
        // поэтому в любой момент времени можно узнать происхождение точки.
        for (const point of points) {
          point.px = cx + point.x;
          point.py = cy + point.y;
          point.wordIndex = index;
          point.word = label;
        }

        pieces.push({
          label,
          cx,
          cy,
          fontSize,
          colorName,
          points,
          delay: (row + col) * STAGGER_MS
        });
      });
    }

    function fitTextSize(label, maxWidth, preferred) {
      let size = preferred;
      textSize(size);
      while (textWidth(label) > maxWidth && size > 30) {
        size -= 1;
        textSize(size);
      }
      return size;
    }

    // Готовит слой буквы «А» к отрисовке — единственная картинка вступления,
    // фон теперь считается (см. GLOW_COLORS/sampleGlowColor), а не грузится.
    function buildIntroLayers() {
      try {
        if (introGlyphReady && introGlyphImg) {
          introGlyphLayer = introGlyphImg;
        }
      } catch (err) {
        introGlyphLayer = null;
      }
    }

    let sampler = null;

    function sampleWord(label, fontSize, boxW, boxH) {
      const w = Math.floor(boxW);
      const h = Math.floor(boxH);
      if (!sampler || sampler.width !== w || sampler.height !== h) {
        sampler = createGraphics(w, h);
        sampler.pixelDensity(1);
      }
      const layer = sampler;
      layer.clear();
      layer.textFont('PT Mono');
      layer.textSize(fontSize);
      layer.textAlign(CENTER, CENTER);
      layer.noStroke();
      layer.fill(255);
      layer.text(label, layer.width / 2, layer.height / 2 - 1);
      layer.loadPixels();

      const result = [];
      for (let y = 1; y < layer.height - 1; y += DOT_STEP) {
        for (let x = 1; x < layer.width - 1; x += DOT_STEP) {
          const alpha = layer.pixels[(x + y * layer.width) * 4 + 3];
          if (alpha > 90) {
            const u = x / layer.width - 0.5;
            const v = y / layer.height - 0.5;
            const dist = Math.hypot(u, v) / Math.SQRT1_2; // 0 в центре облака, ~1 в углу
            const glowColor = sampleGlowColor(dist);
            const tigleR = red(glowColor);
            const tigleG = green(glowColor);
            const tigleB = blue2(glowColor);
            result.push({
              id: nextPointId++,
              x: x - layer.width / 2,
              y: y - layer.height / 2,
              px: 0,
              py: 0,
              vx: 0,
              vy: 0,
              phase: random(TWO_PI),
              densityRank: random(),
              linkRank: random(),
              r: 230,
              g: 232,
              b: 238,
              tigleR: tigleR,
              tigleG: tigleG,
              tigleB: tigleB,
              a: 0,
              reveal: random(0, 0.72),
              tone: random(),
              flashUntil: 0
            });
          }
        }
      }
      return result;
    }

    function draw() {
      const bg = color(PALETTE.background);
      const trail = readControl(trailInput, 80) / 100;
      bg.setAlpha(255);
      noStroke();
      fill(bg);
      rect(0, 0, width, height);

      // Звёздное поле — самый дальний слой сцены, поэтому рисуется первым,
      // сразу по фону, до слов, планет и точки вращения.
      updateStars();
      drawStars();

      const elapsed = millis() - startedAt;
      // Растворение слова «любовь» и рождение точек слов из его свечения —
      // одно общее, медленное движение на протяжении целой минуты. Тот же
      // прогресс, что тает слово, двигает и появление точек.
      const progress = drawIntro(elapsed);

      const density = 0.1 + 0.9 * (readControl(densityInput, 60) / 100);
      const speedMul = readControl(speedInput, 100) / 100;
      const vortex = readControl(vortexInput, 100) / 100;
      const sphere = readControl(sphereInput, 0) / 100;
      // Размер сферы задаёт только этот ползунок — к притяжению точки
      // вращения он больше не привязан.
      sphereRadiusPx = lerp(SPHERE_RADIUS_MIN, SPHERE_RADIUS_MAX, sphere);
      const distance = readControl(distanceInput, 100) / 100;
      const cohesion = readControl(cohesionInput, 0) / 100;
      // Удалённость задаёт радиус, дальше которого точки одного слова не
      // могут разлететься друг от друга: 10% размера экрана на нуле, 80%
      // на максимуме. Считается он от центра их же облака, в updateWordPoints.
      const screenSize = Math.hypot(width, height);
      const maxSpread = lerp(screenSize * DIST_MIN_SHARE, screenSize * DIST_MAX_SHARE, distance);
      const linkShare = (readControl(linksInput, 0) / 100) * LINK_MAX_SHARE;
      const glow = readControl(glowInput, 45) / 100;

      updatePresence(readControl(presenceInput, 0) / 100);
      updateSun();
      drawSun();
      updatePlanet();
      drawPlanet();
      updatePlanet2();
      drawPlanet2();
      updateField(elapsed);
      activePoints.length = 0;

      for (const piece of pieces) {
        updateWordPoints(piece, progress, elapsed, density, speedMul, vortex, sphere, maxSpread, cohesion);
      }

      resolveCollisions();
      if (linkShare > 0) drawLinks(linkShare);
      drawDots(glow, trail);
      drawPresenceBadge();
      updateControlValueDisplays();
    }

    // Буква «А» весь этот путь плавно становится прозрачной, а исходящее из
    // неё радужное свечение растёт, пока не заполнит собой весь холст, и
    // одновременно растворяется до полной прозрачности — без единого
    // резкого перехода. Именно из этого свечения «рождаются» точки слов
    // (см. progress в draw()). Возвращает 0..1 — общий прогресс растворения
    // и рождения точек.
    function drawIntro(elapsed) {
      const t = constrain(elapsed / INTRO_MS, 0, 1);
      const eased = t * t * (3 - 2 * t);

      // Буква «А» тает вдвое быстрее общего минутного хода — рождение точек
      // по-прежнему идёт за eased/минуту, а вот собственная прозрачность
      // буквы считается по своему, ускоренному ходу wordEased: она
      // растворяется первой, «в тигле» (сам тигл остаётся под ней и растёт).
      // И буква, и свечение на самом старте уже на 15% прозрачны (85% альфы),
      // а не полностью непрозрачны — общий множитель INTRO_START_ALPHA.
      const wordT = constrain(t * WORD_DISSOLVE_SPEEDUP, 0, 1);
      const wordEased = wordT * wordT * (3 - 2 * wordT);
      const wordAlpha = 255 * INTRO_START_ALPHA * (1 - wordEased);

      const cx = width / 2;
      const cy = height / 2;
      const glyphSize = INTRO_GLOW_BASE * 2; // буква — неизменного размера, как раньше было неизменным introFontSize

      // Свечение растворяется из буквы «А» во все стороны и заполняет собой
      // всё пространство холста: радиус растёт не до фиксированной отметки,
      // а до самого дальнего угла экрана, — и одновременно, тем же плавным
      // ходом eased, тает до полной прозрачности. Никакого резкого
      // исчезновения на t=1 — оба хода (рост и растворение) непрерывны и
      // синхронны, свечение само гаснет раньше, чем перестаёт расти.
      const glowMaxRadius = Math.hypot(width, height) / 2 + INTRO_GLOW_BASE;
      const glowRadius = lerp(INTRO_GLOW_BASE, glowMaxRadius, eased);
      const glowAlphaMul = INTRO_START_ALPHA * (1 - eased);

      if (glowAlphaMul > 0.002) {
        const context = drawingContext;
        const halo = context.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
        const stops = GLOW_COLORS.length - 1;
        for (let i = 0; i < GLOW_COLORS.length; i++) {
          const c = color(GLOW_COLORS[i]);
          const stopAlpha = i === GLOW_COLORS.length - 1 ? 0 : glowAlphaMul; // край свечения — всегда прозрачный, не плашка цвета фона
          halo.addColorStop(i / stops, `rgba(${red(c)}, ${green(c)}, ${blue2(c)}, ${stopAlpha})`);
        }
        noStroke();
        context.fillStyle = halo;
        context.beginPath();
        context.arc(cx, cy, glowRadius, 0, TWO_PI);
        context.fill();
      }

      if (wordAlpha > 0.5 && introGlyphLayer) {
        push();
        imageMode(CENTER);
        tint(255, wordAlpha);
        image(introGlyphLayer, cx, cy, glyphSize, glyphSize);
        pop();
      }

      return eased;
    }

    function readControl(input, fallback) {
      const value = input ? Number(input.value) : fallback;
      return Number.isFinite(value) ? value : fallback;
    }

    // Рядом с каждым ползунком — его текущее значение в цифрах, живьём.
    function updateControlValueDisplays() {
      const ranges = document.querySelectorAll('#controls input[type="range"]');
      ranges.forEach(input => {
        const span = input.nextElementSibling;
        if (!span || !span.classList.contains('control-value')) return;
        const suffix = span.dataset.suffix || '';
        span.textContent = Math.round(Number(input.value)) + suffix;
      });
    }
    // Микрофон включает и выключает кнопка (presenceEnabled), а не ползунок —
    // ползунок «чувствительность» лишь настраивает порог, пока микрофон
    // включён: на малой раскачку даёт только громкий звук, на полной хватает
    // тихого шороха. Нарастает раскачка быстро, спадает медленнее — как у
    // обычного индикатора громкости, чтобы взмах не дёргался.
    function updatePresence(sensitivity) {
      const now = millis();
      const dt = presenceAt ? Math.min(0.1, (now - presenceAt) / 1000) : 1 / 30;
      presenceAt = now;
      if (!presenceEnabled) {
        stopMic();
        soundLevel = 0;
        for (const z in zones) zones[z] = 0;
        presenceDrive = Math.max(0, presenceDrive - dt * 1.2);
        updatePresenceToggleUI();
        return;
      }
      ensureMic();
      let energy = 0;
      if (micReady && analyser && micData) {
        analyser.getByteTimeDomainData(micData);
        let sumSquares = 0;
        for (let i = 0; i < micData.length; i++) {
          const v = (micData[i] - 128) / 128;
          sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / micData.length);
        energy = constrain(rms * 7, 0, 1);
      }
      soundLevel = lerp(soundLevel, energy, 0.35);
      zones.head = lerp(zones.head, soundLevel, 0.45);
      zones.torso = lerp(zones.torso, soundLevel, 0.3);
      zones.left = lerp(zones.left, soundLevel, 0.22);
      zones.right = lerp(zones.right, soundLevel, 0.18);
      const threshold = 0.5 * (1 - sensitivity) + 0.015;
      const drive = soundLevel >= threshold
        ? (soundLevel - threshold) / Math.max(0.05, 1 - threshold)
        : 0;
      const rate = drive > presenceDrive ? 3.2 + 3.5 * sensitivity : 1.4;
      presenceDrive += (drive - presenceDrive) * Math.min(1, rate * dt);
      presenceDrive = constrain(presenceDrive, 0, 1);
      updatePresenceToggleUI();
    }

    // Точка вращения неподвижна и стоит ровно в центре холста — вокруг неё
    // вращается всё остальное. В отличие от планеты, на нуле ползунка у неё
    // нет массы вовсе: это честный ноль, а не лунная масса по умолчанию.
    function updateSun() {
      const t = readControl(sunAttractionInput, 0) / 100;
      sunMassRatio = t * (SUN_MASS_KG / MOON_MASS_KG);
      sunRadiusPx = lerp(SUN_RADIUS_MIN, SUN_RADIUS_MAX, t);
    }

    // Белое раскалённое ядро в тёплом оранжевом ореоле — тот же приём
    // радиального градиента, что и у обычных точек, но с запасом ярче и
    // крупнее: это самый яркий объект на сцене.
    function drawSun() {
      const context = drawingContext;
      const sx = width / 2;
      const sy = height / 2;
      const c = color(PALETTE.orange);
      const r = red(c);
      const g = green(c);
      const b = blue2(c);
      const haloRadius = sunRadiusPx * 6;
      const halo = context.createRadialGradient(sx, sy, 0, sx, sy, haloRadius);
      halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.75)`);
      halo.addColorStop(0.25, `rgba(${r}, ${g}, ${b}, 0.32)`);
      halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      noStroke();
      context.fillStyle = halo;
      context.beginPath();
      context.arc(sx, sy, haloRadius, 0, TWO_PI);
      context.fill();
      fill(PALETTE.light);
      circle(sx, sy, sunRadiusPx * 2);
    }

    // Планета движется по своей орбите независимо от присутствия и звука —
    // ползунки блока «планета» задают массу (сила притяжения), скорость
    // вращения и расстояние орбиты. На нуле всех трёх — это условная Луна:
    // её масса, её скорость и её расстояние, просто уменьшенные до масштаба
    // холста, а не выключенное состояние.
    function updatePlanet() {
      const now = millis();
      const dt = planetAt ? Math.min(0.1, (now - planetAt) / 1000) : 1 / 30;
      planetAt = now;

      const massT = readControl(planetMassInput, 0) / 100;
      const speedT = readControl(planetSpeedInput, 0) / 100;
      const distT = readControl(planetDistanceInput, 0) / 100;

      planetMassRatio = Math.pow(SATURN_MASS_KG / MOON_MASS_KG, massT) * 5;
      planetDistanceRatio = lerp(1, 100, distT);

      const speedMultiplier = lerp(1, 100, speedT);
      const angularSpeed = (TWO_PI / MOON_ORBIT_PERIOD_S) * speedMultiplier;
      planetAngle += angularSpeed * dt;

      const rx = lerp(PLANET_ORBIT_RX, PLANET_ORBIT_RX * PLANET_ORBIT_GROWTH, distT);
      const ry = lerp(PLANET_ORBIT_RY, PLANET_ORBIT_RY * PLANET_ORBIT_GROWTH, distT);
      planetX = width / 2 + Math.cos(planetAngle) * rx;
      planetY = height / 2 + Math.sin(planetAngle) * ry;
      planetRadiusPx = lerp(PLANET_RADIUS_MIN, PLANET_RADIUS_MAX, Math.sqrt(massT));
      // Орбита наклонена по глубине — на притяжение точек это не влияет
      // (оно по-прежнему считается в исходной плоскости), но на экране тело
      // то выходит вперёд, то уходит вглубь.
      planetDepthZ = Math.sin(planetAngle) * PLANET_DEPTH_TILT;
      planetScale = DEPTH_FOCAL / (DEPTH_FOCAL + planetDepthZ);
    }

    // Тело снова синее — светится тем же приёмом, что обычные точки
    // (радиальный градиент поверх ядра), крупнее и в голубом — отдельный,
    // узнаваемый акцент от оранжевого солнца, звука и белёсых слов.
    function drawPlanet() {
      const context = drawingContext;
      const c = color(PALETTE.blue);
      const r = red(c);
      const g = green(c);
      const b = blue2(c);
      // Проекция глубины: планета рисуется не в planetX/planetY, а в точке,
      // растянутой от центра сцены на её масштаб глубины — так наклон орбиты
      // становится виден (тело крупнее, когда выходит вперёд, мельче — когда
      // уходит вглубь).
      const sx = width / 2 + (planetX - width / 2) * planetScale;
      const sy = height / 2 + (planetY - height / 2) * planetScale;
      const radiusPx = planetRadiusPx * planetScale;
      const haloRadius = radiusPx * 3.4;
      const halo = context.createRadialGradient(
        sx, sy, 0,
        sx, sy, haloRadius
      );
      halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.55)`);
      halo.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, 0.22)`);
      halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      noStroke();
      context.fillStyle = halo;
      context.beginPath();
      context.arc(sx, sy, haloRadius, 0, TWO_PI);
      context.fill();
      fill(c);
      circle(sx, sy, radiusPx * 2);
    }

    // Красная планета живёт по тем же правилам, что и синяя (свой блок
    // контролов, та же логика массы, скорости и орбиты), только центр
    // орбиты дальше — см. PLANET2_ORBIT_RX/RY.
    function updatePlanet2() {
      const now = millis();
      const dt = planet2At ? Math.min(0.1, (now - planet2At) / 1000) : 1 / 30;
      planet2At = now;

      const massT = readControl(planet2MassInput, 0) / 100;
      const speedT = readControl(planet2SpeedInput, 0) / 100;
      const distT = readControl(planet2DistanceInput, 0) / 100;

      planet2MassRatio = Math.pow(SATURN_MASS_KG / MOON_MASS_KG, massT) * 5;
      planet2DistanceRatio = lerp(1, 100, distT);

      const speedMultiplier = lerp(1, 100, speedT);
      const angularSpeed = (TWO_PI / MOON_ORBIT_PERIOD_S) * speedMultiplier;
      planet2Angle += angularSpeed * dt;

      const rx = lerp(PLANET2_ORBIT_RX, PLANET2_ORBIT_RX * PLANET_ORBIT_GROWTH, distT);
      const ry = lerp(PLANET2_ORBIT_RY, PLANET2_ORBIT_RY * PLANET_ORBIT_GROWTH, distT);
      planet2X = width / 2 + Math.cos(planet2Angle) * rx;
      planet2Y = height / 2 + Math.sin(planet2Angle) * ry;
      planet2RadiusPx = lerp(PLANET_RADIUS_MIN, PLANET_RADIUS_MAX, Math.sqrt(massT));
      // Своя фаза наклона — чтобы красная планета не ныряла в глубину
      // синхронно с синей.
      planet2DepthZ = Math.sin(planet2Angle + Math.PI / 3) * PLANET2_DEPTH_TILT;
      planet2Scale = DEPTH_FOCAL / (DEPTH_FOCAL + planet2DepthZ);
    }

    // Красный — как раньше чёрный у синей планеты, сознательное исключение
    // из палитры по прямой просьбе (в палитре нет чистого красного).
    function drawPlanet2() {
      const context = drawingContext;
      const c = color('#ff4438');
      const r = red(c);
      const g = green(c);
      const b = blue2(c);
      const sx = width / 2 + (planet2X - width / 2) * planet2Scale;
      const sy = height / 2 + (planet2Y - height / 2) * planet2Scale;
      const radiusPx = planet2RadiusPx * planet2Scale;
      const haloRadius = radiusPx * 3.4;
      const halo = context.createRadialGradient(
        sx, sy, 0,
        sx, sy, haloRadius
      );
      halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.55)`);
      halo.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, 0.22)`);
      halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      noStroke();
      context.fillStyle = halo;
      context.beginPath();
      context.arc(sx, sy, haloRadius, 0, TWO_PI);
      context.fill();
      fill(c);
      circle(sx, sy, radiusPx * 2);
    }

    // Просит доступ к микрофону один раз и держит его, пока кнопка
    // «микрофон» включена. Поток идёт только в анализатор, не на выход
    // звука — иначе микрофон подхватил бы колокольчики и завыл эхом.
    function ensureMic() {
      if (micStream || micRequesting) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      micRequesting = true;
      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
          micRequesting = false;
          if (!presenceEnabled) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = Ctx ? new Ctx() : null;
          }
          if (!audioCtx) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          micStream = stream;
          micSource = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          micData = new Uint8Array(analyser.fftSize);
          micSource.connect(analyser);
          micReady = true;
        })
        .catch(() => {
          micRequesting = false;
          micReady = false;
        });
    }

    // Снимает микрофон целиком: останавливает дорожку потока и отключает
    // узлы анализа — на нуле ползунка доступа к микрофону не остаётся вовсе.
    function stopMic() {
      if (micStream) micStream.getTracks().forEach(track => track.stop());
      if (micSource) micSource.disconnect();
      if (analyser) analyser.disconnect();
      micStream = null;
      micSource = null;
      analyser = null;
      micData = null;
      micReady = false;
    }

    // Поле скорости: вихревое (curl) поле от шума. Оно не сжимает и не
    // разрежает точки, поэтому масса остается ровной и не сбивается в струи.
    function buildField() {
      const cols = Math.ceil(width / FIELD_CELL) + 1;
      const rows = Math.ceil(height / FIELD_CELL) + 1;
      field = {
        cols,
        rows,
        phi: new Float32Array(cols * rows),
        vx: new Float32Array(cols * rows),
        vy: new Float32Array(cols * rows),
        region: new Float32Array(cols * rows)
      };
    }

    // Рождает звёздное поле: у каждой звезды своя точка в объёме перед
    // камерой, разбросанная по всей дальней границе — чтобы с первого кадра
    // сцена уже была полна звёзд, а не заполнялась ими постепенно.
    function buildStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        const star = {
          x: random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD),
          y: random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD),
          z: random(STAR_NEAR_Z, STAR_FAR_Z),
          speedMul: random(STAR_SPEED_MUL_MIN, STAR_SPEED_MUL_MAX),
          prevSx: 0,
          prevSy: 0
        };
        const scale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
        star.prevSx = width / 2 + star.x * scale;
        star.prevSy = height / 2 + star.y * scale;
        stars.push(star);
      }
    }

    // Каждый кадр запоминаем экранное положение звезды до движения (это
    // будет начало отрезка-«скорости»), затем приближаем её на скорость
    // полёта. Пролетевшую мимо камеры звезду пересеваем на дальнюю границу
    // со свежими x/y — поле остаётся бесконечным и никогда не редеет.
    function updateStars() {
      const now = millis();
      const dt = starsAt ? Math.min(0.1, (now - starsAt) / 1000) : 1 / 30;
      starsAt = now;
      // «Скорость звёзд»: на 0 — нынешняя скорость полёта, на 100 — в 10 раз
      // быстрее. Чем быстрее звезда идёт на камеру, тем сильнее меняется её
      // проекция за кадр — отрезок в drawStars() сам вытягивается в линию
      // соответственно скорости, без отдельной логики «переключения».
      const starSpeedT = readControl(starSpeedInput, 0) / 100;
      // «Движение вперёд»: отдельный от «скорости звёзд» множитель — на 0
      // ничего не меняет (нынешняя скорость), на 100 — она вдвое быстрее.
      const forwardMul = lerp(1, 2, readControl(starForwardInput, 0) / 100);
      const flightSpeed = STAR_FLIGHT_SPEED * lerp(1, 10, starSpeedT) * forwardMul;
      // «Вращение звёзд»: ось этого вращения — сам вектор движения
      // центральной точки (направление полёта), поэтому поле не смещается,
      // а медленно проворачивается вокруг него. На 0 вращения нет вовсе.
      const spinSpeed = STAR_SPIN_MAX_SPEED * (readControl(starSpinInput, 0) / 100);
      const cosOld = Math.cos(starSpinAngle);
      const sinOld = Math.sin(starSpinAngle);
      starSpinAngle += spinSpeed * dt;
      const cosNew = Math.cos(starSpinAngle);
      const sinNew = Math.sin(starSpinAngle);
      for (const star of stars) {
        const scale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
        const rx = star.x * cosOld - star.y * sinOld;
        const ry = star.x * sinOld + star.y * cosOld;
        star.prevSx = width / 2 + rx * scale;
        star.prevSy = height / 2 + ry * scale;
        star.z -= flightSpeed * star.speedMul * dt;
        if (star.z <= STAR_NEAR_Z) {
          star.x = random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD);
          star.y = random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD);
          star.z = random(STAR_FAR_Z * 0.75, STAR_FAR_Z);
          star.speedMul = random(STAR_SPEED_MUL_MIN, STAR_SPEED_MUL_MAX);
          const freshScale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
          const frx = star.x * cosNew - star.y * sinNew;
          const fry = star.x * sinNew + star.y * cosNew;
          star.prevSx = width / 2 + frx * freshScale;
          star.prevSy = height / 2 + fry * freshScale;
        }
      }
    }

    // Рисуется звезда не точкой, а отрезком от прошлого экранного положения
    // к нынешнему: у дальних звёзд это положение почти не меняется за кадр,
    // и отрезок читается как едва заметная точка, а у ближних меняется
    // сильно — отрезок вытягивается в линию, само собой отражая скорость
    // полёта сквозь пространство.
    // Рисует один отрезок звёздного хвоста с градиентом вдоль длины —
    // прозрачный на дальнем конце, полного цвета и alpha у головы. Общий
    // помощник для тени/полутона/блика в drawStars() — три параллельных
    // отрезка вместе и дают объём (см. ниже).
    function drawStarSegment(context, x1, y1, x2, y2, r, g, b, alpha, lineWidth) {
      const gradient = context.createLinearGradient(x1, y1, x2, y2);
      gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0)`);
      gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${alpha})`);
      context.strokeStyle = gradient;
      context.lineWidth = lineWidth;
      context.lineCap = 'round';
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    }

    function drawStars() {
      const context = drawingContext;
      const base = color(PALETTE.muted);
      const bright = color(PALETTE.light);
      // «Контраст звёзд»: на 0 — нынешняя разница размера и яркости между
      // дальними и ближними звёздами, на 100 — вдвое больше. Меняется только
      // сама разница (множитель ниже), базовая величина дальних звёзд
      // отсчитывается отдельно, от «яркости звёзд».
      const contrastMul = lerp(1, 2, readControl(starContrastInput, 0) / 100);
      // «Яркость звёзд» задаёт яркость самой тусклой, дальней звезды — на 0
      // это нынешнее значение (36), на 100 — полная яркость (255). Все
      // остальные звёзды светлее её на ту же разницу, что и раньше, то есть
      // считаются относительно этой базы, а не заново с нуля.
      const dimAlpha = lerp(36, 255, readControl(starBrightnessInput, 0) / 100);
      const cosA = Math.cos(starSpinAngle);
      const sinA = Math.sin(starSpinAngle);
      // «Скорость звёзд», вторая часть эффекта: хвост звезды тянется не
      // только от её собственного смещения за кадр, но и подтягивается к
      // центру экрана — на 0 это нынешнее (уже удлинённое STAR_TAIL_STRETCH)
      // смещение, на 100% хвост дотягивается до самого центра, и все звёзды
      // сливаются в сплошные прямые линии.
      const tailShare = readControl(starSpeedInput, 0) / 100;
      for (const star of stars) {
        const scale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
        const rx = star.x * cosA - star.y * sinA;
        const ry = star.x * sinA + star.y * cosA;
        const sx = width / 2 + rx * scale;
        const sy = height / 2 + ry * scale;
        // Хвост длиннее прежнего: не голое смещение за кадр, а оно же,
        // растянутое в STAR_TAIL_STRETCH раз от текущего положения звезды.
        const stretchedTailX = sx + (star.prevSx - sx) * STAR_TAIL_STRETCH;
        const stretchedTailY = sy + (star.prevSy - sy) * STAR_TAIL_STRETCH;
        const tailX = lerp(stretchedTailX, width / 2, tailShare);
        const tailY = lerp(stretchedTailY, height / 2, tailShare);
        const depthT = constrain(1 - star.z / STAR_FAR_Z, 0, 1);
        const c = lerpColor(base, bright, depthT);
        const alpha = Math.min(255, dimAlpha + depthT * 190 * contrastMul);
        const r = red(c);
        const g = green(c);
        const b = blue2(c);
        // Толщина линии — не только от контраста дальше/ближе, а прямо от
        // перспективного масштаба звезды (scale): по мере приближения линия
        // расширяется в трёхмерном пространстве, как и положено объекту,
        // а не остаётся плоской чертой одной ширины.
        const lineWidth = (0.6 + depthT * 1.4 * contrastMul) * scale * 1.5;
        // Объём: вместо одной линии — три параллельных отрезка, сдвинутых
        // поперёк движения звезды. Тень с одной стороны, блик с другой,
        // между ними — основной тон; вместе читается как круглое сечение,
        // освещённое с одного бока, а не плоская черта.
        const dx = sx - tailX;
        const dy = sy - tailY;
        const segLen = Math.hypot(dx, dy) || 1;
        const nx = -dy / segLen;
        const ny = dx / segLen;
        const shadeOffset = lineWidth * 0.55;
        const shadowColor = lerpColor(c, color(PALETTE.background), 0.6);
        const highlightColor = lerpColor(c, color(PALETTE.light), 0.65);
        drawStarSegment(
          context,
          tailX - nx * shadeOffset, tailY - ny * shadeOffset,
          sx - nx * shadeOffset, sy - ny * shadeOffset,
          red(shadowColor), green(shadowColor), blue2(shadowColor),
          (alpha / 255) * 0.7, lineWidth * 0.75
        );
        drawStarSegment(context, tailX, tailY, sx, sy, r, g, b, alpha / 255, lineWidth);
        drawStarSegment(
          context,
          tailX + nx * shadeOffset, tailY + ny * shadeOffset,
          sx + nx * shadeOffset, sy + ny * shadeOffset,
          red(highlightColor), green(highlightColor), blue2(highlightColor),
          (alpha / 255) * 0.6, lineWidth * 0.5
        );
      }
      noStroke();
    }

    function updateField(elapsed) {
      const t = elapsed * 0.00005;
      const { cols, rows, phi, vx, vy, region } = field;

      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          phi[i + j * cols] = noise(i * FIELD_WAVE, j * FIELD_WAVE, t);
          region[i + j * cols] = noise(i * FIELD_WAVE * 0.6 + 300, j * FIELD_WAVE * 0.6 + 300, t * 0.6);
        }
      }

      let regionMin = 1;
      let regionMax = 0;
      for (let k = 0; k < cols * rows; k++) {
        if (region[k] < regionMin) regionMin = region[k];
        if (region[k] > regionMax) regionMax = region[k];
      }
      const regionSpan = Math.max(regionMax - regionMin, 0.0001);
      for (let k = 0; k < cols * rows; k++) {
        region[k] = (region[k] - regionMin) / regionSpan;
      }

      let maxMag = 0.0001;
      for (let j = 0; j < rows; j++) {
        const jm = Math.max(j - 1, 0);
        const jp = Math.min(j + 1, rows - 1);
        for (let i = 0; i < cols; i++) {
          const im = Math.max(i - 1, 0);
          const ip = Math.min(i + 1, cols - 1);
          const dx = phi[ip + j * cols] - phi[im + j * cols];
          const dy = phi[i + jp * cols] - phi[i + jm * cols];
          const k = i + j * cols;
          vx[k] = dy;
          vy[k] = -dx;
          const mag = Math.hypot(dy, dx);
          if (mag > maxMag) maxMag = mag;
        }
      }

      const targetGain = MAX_SPEED / maxMag;
      fieldGain = fieldGain === 0 ? targetGain : lerp(fieldGain, targetGain, 0.03);
    }

    function sampleField(x, y, out) {
      const { cols, rows, vx, vy, region } = field;
      const fx = constrain(x / FIELD_CELL, 0, cols - 1.001);
      const fy = constrain(y / FIELD_CELL, 0, rows - 1.001);
      const i = Math.floor(fx);
      const j = Math.floor(fy);
      const u = fx - i;
      const v = fy - j;
      const k00 = i + j * cols;
      const k10 = k00 + 1;
      const k01 = k00 + cols;
      const k11 = k01 + 1;
      const w00 = (1 - u) * (1 - v);
      const w10 = u * (1 - v);
      const w01 = (1 - u) * v;
      const w11 = u * v;
      out.vx = (vx[k00] * w00 + vx[k10] * w10 + vx[k01] * w01 + vx[k11] * w11) * fieldGain;
      out.vy = (vy[k00] * w00 + vy[k10] * w10 + vy[k01] * w01 + vy[k11] * w11) * fieldGain;
      out.region = region[k00] * w00 + region[k10] * w10 + region[k01] * w01 + region[k11] * w11;
    }

    function drawSolidWord(piece, visibility) {
      if (visibility <= 0) return;
      push();
      textSize(piece.fontSize);
      textStyle(NORMAL);
      textAlign(CENTER, CENTER);
      const c = color(PALETTE[piece.colorName]);
      c.setAlpha(235 * visibility);
      fill(c);
      text(piece.label, piece.cx, piece.cy - 1);
      pop();
    }

    const fieldSample = { vx: 0, vy: 0, region: 0 };
    const blue2 = c => blue(c);

    // Через SHATTER_AT_MS после загрузки все слова разом «раскалываются»:
    // расписание крошения каждого слова переигрывается так, будто оно
    // стартует прямо сейчас (вместо своей обычной, гораздо более поздней
    // и растянутой очереди), а каждая точка получает собственную, сеяную
    // случайную цель на экране и короткий резкий рывок к ней — россыпь
    // осколков, а не плавный дрейф.
    function triggerShatter(elapsed) {
      for (const piece of pieces) {
        piece.delay = elapsed - HOLD_MS;
        for (const point of piece.points) {
          const homeX = piece.cx + point.x;
          const homeY = piece.cy + point.y;
          point.px = homeX;
          point.py = homeY;
          point.shatterFromX = homeX;
          point.shatterFromY = homeY;
          const angle = random(TWO_PI);
          const dist = random(SHATTER_MIN_DIST, SHATTER_MAX_DIST);
          point.shatterToX = constrain(homeX + Math.cos(angle) * dist, 12, width - 12);
          point.shatterToY = constrain(homeY + Math.sin(angle) * dist, 12, height - 12);
          point.shatterStart = elapsed + point.reveal * 0.42 * CRUMBLE_MS;
          point.shattering = true;
        }
      }
    }

    // Считает новое положение и цвет каждой точки слова. Рисование - отдельно,
    // чтобы линии легли под точками, а не поверх них.
    function updateWordPoints(piece, progress, elapsed, density, speedMul, vortex, sphere, maxSpread, cohesion) {
      if (progress <= 0) return;
      const breathTime = elapsed * 0.00115;
      // Движение включается по тому же прогрессу, что и рождение точек из
      // света слова «любовь» (см. progress в draw()) — точки одновременно
      // проявляются и понемногу оживают, без отдельной постфазы.
      const flow = progress * progress * (3 - 2 * progress);

      // Проход 1: двигаем точки слова и собираем тех, что сейчас видны —
      // по ним построим центр их собственного, а не изначального, облака.
      liveScratch.length = 0;
      for (const point of piece.points) {
        if (point.densityRank > density) continue;

        const local = constrain((progress - point.reveal * 0.42) / 0.58, 0, 1);
        if (local <= 0) continue;

        if (flow > 0) {
          sampleField(point.px, point.py, fieldSample);
          let targetVx = fieldSample.vx;
          let targetVy = fieldSample.vy;
          if (vortex > 0) {
            // Широкая горизонтальная восьмёрка с мягким переходом из облака.
            if (point.orbitPhase === undefined) point.orbitPhase = point.phase;
            const radiusX = 440 + (point.tone - 0.5) * 90;
            const radiusY = 220 + (point.densityRank - 0.5) * 60;
            const theta = point.orbitPhase;
            const tangentX = radiusX * Math.cos(theta);
            const tangentY = 2 * radiusY * Math.cos(2 * theta);
            const angularSpeed = 0.9 / Math.max(1, Math.hypot(tangentX, tangentY));
            const targetX = width / 2 + radiusX * Math.sin(theta);
            const targetY = height / 2 + radiusY * Math.sin(2 * theta);
            const orbitVx = tangentX * angularSpeed + (targetX - point.px) * 0.018;
            const orbitVy = tangentY * angularSpeed + (targetY - point.py) * 0.018;
            targetVx = lerp(targetVx, orbitVx, vortex);
            targetVy = lerp(targetVy, orbitVy, vortex);
            point.orbitPhase += angularSpeed * flow * speedMul * vortex;
          }
          if (sphere > 0) {
            // «Сфера»: точка вращается вокруг центральной точки по
            // поверхности сферы — азимут (theta) и полюс (phi), у каждой
            // точки свой стартовый угол и свой личный темп смены полюса
            // (spherePhiRate), поэтому сфера не плоское кольцо и не дышит
            // глубиной синхронно всем облаком разом (иначе это читалось бы
            // как пульсация яркости — масштаб глубины напрямую влияет на
            // размер и свечение точки, см. drawDots()). Диаметр —
            // sphereRadiusPx, задаётся ползунком «сфера» (см. draw()).
            if (point.sphereTheta === undefined) point.sphereTheta = point.phase;
            if (point.spherePhi === undefined) point.spherePhi = point.tone * Math.PI * 2;
            if (point.spherePhiRate === undefined) point.spherePhiRate = random(SPHERE_PHI_RATE_MIN, SPHERE_PHI_RATE_MAX);
            const theta = point.sphereTheta;
            const phi = point.spherePhi;
            const sinPhi = Math.sin(phi);
            const sphereX = sphereRadiusPx * sinPhi * Math.cos(theta);
            const sphereY = sphereRadiusPx * sinPhi * Math.sin(theta);
            const tangentSphereX = -sphereRadiusPx * sinPhi * Math.sin(theta);
            const tangentSphereY = sphereRadiusPx * sinPhi * Math.cos(theta);
            const targetSphereX = width / 2 + sphereX;
            const targetSphereY = height / 2 + sphereY;
            const sphereOrbitVx = tangentSphereX * SPHERE_ANGULAR_SPEED + (targetSphereX - point.px) * 0.02;
            const sphereOrbitVy = tangentSphereY * SPHERE_ANGULAR_SPEED + (targetSphereY - point.py) * 0.02;
            targetVx = lerp(targetVx, sphereOrbitVx, sphere);
            targetVy = lerp(targetVy, sphereOrbitVy, sphere);
            point.sphereTheta += SPHERE_ANGULAR_SPEED * flow * speedMul * sphere;
            point.spherePhi += SPHERE_PHI_SPEED * point.spherePhiRate * flow * speedMul * sphere;
            point.sphereDepth = sphereRadiusPx * Math.cos(phi);
            point.sphereRadiusXY = sphereRadiusPx * sinPhi;
          }
          if (cohesion > 0) {
            // Связность стягивает точки слова к месту, где оно стояло на
            // экране: тяга растёт с расстоянием, но не сильнее потолка, а
            // сила прямо пропорциональна ползунку — 0% это отсутствие тяги,
            // 100% — её полная, ничем не срезанная величина.
            const dxHome = piece.cx - point.px;
            const dyHome = piece.cy - point.py;
            const distHome = Math.hypot(dxHome, dyHome);
            if (distHome > 1) {
              const pullMag = Math.min(distHome * COHESION_RATE, COHESION_MAX_PULL) * cohesion;
              targetVx += (dxHome / distHome) * pullMag;
              targetVy += (dyHome / distHome) * pullMag;
            }
          }
          point.vx = lerp(point.vx, targetVx * flow * speedMul, 0.08);
          point.vy = lerp(point.vy, targetVy * flow * speedMul, 0.08);
          if (vortex > 0 || sphere > 0) {
            const limit = Math.min(1, 2.7 / Math.max(0.001, Math.hypot(point.vx, point.vy)));
            point.vx *= limit;
            point.vy *= limit;
          }
          point.px += point.vx;
          point.py += point.vy;
          if (presenceDrive > 0) {
            // Звук раскачивает точку по её собственной фазе (point.phase),
            // поэтому общий гул микрофона превращается в россыпь разных
            // траекторий, а не в один общий рывок. Громче звук — шире взмах.
            const swing = presenceDrive * PRESENCE_OSC_AMP;
            const t = elapsed * PRESENCE_OSC_SPEED + point.phase;
            point.px += Math.cos(t) * swing;
            point.py += Math.sin(t * 1.3 + point.phase) * swing;
          }
          // Притяжение планеты: сила растёт с её массой, падает с квадратом
          // абстрактного расстояния орбиты (ползунок «расстояние») и ещё раз —
          // с квадратом настоящего, экранного расстояния до точки. Рядом с
          // телом сила смягчена (PLANET_SOFTEN), на удалении — гаснет сама.
          {
            const pdx = planetX - point.px;
            const pdy = planetY - point.py;
            const pDistSq = pdx * pdx + pdy * pdy + PLANET_SOFTEN * PLANET_SOFTEN;
            const pDist = Math.sqrt(pDistSq);
            const pullMag = Math.min(
              (PLANET_PULL_BASE * planetMassRatio) /
                (planetDistanceRatio * planetDistanceRatio) /
                pDistSq,
              PLANET_PULL_MAX
            );
            point.px += (pdx / pDist) * pullMag;
            point.py += (pdy / pDist) * pullMag;
          }
          // Притяжение красной планеты — та же формула, что у синей, свой
          // центр и своя масса.
          {
            const p2dx = planet2X - point.px;
            const p2dy = planet2Y - point.py;
            const p2DistSq = p2dx * p2dx + p2dy * p2dy + PLANET_SOFTEN * PLANET_SOFTEN;
            const p2Dist = Math.sqrt(p2DistSq);
            const p2PullMag = Math.min(
              (PLANET_PULL_BASE * planet2MassRatio) /
                (planet2DistanceRatio * planet2DistanceRatio) /
                p2DistSq,
              PLANET_PULL_MAX
            );
            point.px += (p2dx / p2Dist) * p2PullMag;
            point.py += (p2dy / p2Dist) * p2PullMag;
          }
          // Притяжение точки вращения — неподвижного «солнца» в центре
          // холста. На нуле ползунка «притяжение» массы нет вовсе, силы
          // тоже нет; на максимуме именно эта тяга держит всё вокруг себя,
          // как и положено солнцу солнечной системы.
          if (sunMassRatio > 0) {
            const sdx = width / 2 - point.px;
            const sdy = height / 2 - point.py;
            const sDistSq = sdx * sdx + sdy * sdy + SUN_SOFTEN * SUN_SOFTEN;
            const sDist = Math.sqrt(sDistSq);
            const sPullMag = Math.min((SUN_PULL_BASE * sunMassRatio) / sDistSq, SUN_PULL_MAX);
            point.px += (sdx / sDist) * sPullMag;
            point.py += (sdy / sDist) * sPullMag;
          }
          if (point.px < -4) point.px += width + 8;
          if (point.px > width + 4) point.px -= width + 8;
          if (point.py < -4) point.py += height + 8;
          if (point.py > height + 4) point.py -= height + 8;

          if (sphere > 0 && point.sphereRadiusXY !== undefined) {
            const sLockDx = point.px - width / 2;
            const sLockDy = point.py - height / 2;
            const sLockDist = Math.hypot(sLockDx, sLockDy) || 1;
            const sLockedDist = lerp(sLockDist, point.sphereRadiusXY, sphere);
            point.px = width / 2 + (sLockDx / sLockDist) * sLockedDist;
            point.py = height / 2 + (sLockDy / sLockDist) * sLockedDist;
          }

          point._region = fieldSample.region;
        } else {
          point._region = 0.5;
        }

        // Осколок летит к своей случайной цели резким рывком, а не полем —
        // потом, когда рывок закончен, точка спокойно передаётся обычному
        // течению (полю, вихрю, связности) со скоростью, взятой из направления рывка.
        if (point.shattering) {
          const t = constrain((elapsed - point.shatterStart) / SHATTER_DURATION_MS, 0, 1);
          if (t <= 0) {
            point.px = point.shatterFromX;
            point.py = point.shatterFromY;
          } else {
            const eased = 1 - Math.pow(1 - t, 3);
            point.px = lerp(point.shatterFromX, point.shatterToX, eased);
            point.py = lerp(point.shatterFromY, point.shatterToY, eased);
            if (t >= 1) {
              point.shattering = false;
              point.vx = (point.shatterToX - point.shatterFromX) * 0.002;
              point.vy = (point.shatterToY - point.shatterFromY) * 0.002;
            }
          }
        }

        liveScratch.push(point);
      }

      // Удалённость: точки одного слова не могут разлететься дальше
      // maxSpread друг от друга. Меряем не от места, где слово стояло на
      // экране, а от центра их же текущего облака — оно само может уплыть
      // по полю и вихрю, а вот друг от друга точки дальше отведённого не
      // разойдутся. Граница гасит скорость наружу, и точка скользит вдоль
      // неё, а не бьётся о неё.
      if (flow > 0 && liveScratch.length > 1) {
        let centerX = 0;
        let centerY = 0;
        for (const point of liveScratch) {
          centerX += point.px;
          centerY += point.py;
        }
        centerX /= liveScratch.length;
        centerY /= liveScratch.length;

        for (const point of liveScratch) {
          const fromCenterX = point.px - centerX;
          const fromCenterY = point.py - centerY;
          const distFromCenter = Math.hypot(fromCenterX, fromCenterY);
          if (distFromCenter > maxSpread) {
            const scale = maxSpread / distFromCenter;
            point.px = centerX + fromCenterX * scale;
            point.py = centerY + fromCenterY * scale;
            const nx = fromCenterX / distFromCenter;
            const ny = fromCenterY / distFromCenter;
            const outward = point.vx * nx + point.vy * ny;
            if (outward > 0) {
              point.vx -= outward * nx;
              point.vy -= outward * ny;
            }
          }
        }
      }

      // Проход 2: цвет и попадание в общий список отрисовки.
      for (const point of liveScratch) {
        const local = constrain((progress - point.reveal * 0.42) / 0.58, 0, 1);
        const reveal = local * local * (3 - 2 * local);

        // Цвет точки сохраняется: он один раз взят из соответствующего
        // места картинки тигла при рождении точки (см. sampleWord()) и
        // больше не пересчитывается.
        point.r = point.tigleR;
        point.g = point.tigleG;
        point.b = point.tigleB;
        point.a = (185 + 30 * sin(breathTime * 0.7 + point.phase)) * reveal;
        point.breathe = 0.96 + sin(breathTime + point.phase) * 0.08;
        // Глубина: точка не привязана к плоскости — у неё своя, по фазе
        // рождения, медленная волна вперёд-назад в объёме сцены. Гравитация
        // и столкновения по-прежнему считаются в исходной плоскости (px, py),
        // а на экране точка проецируется через масштаб глубины — ближе к
        // камере крупнее, дальше — мельче, как и положено в 3D.
        const breatheDepthZ = Math.sin(elapsed * POINT_DEPTH_SPEED + point.phase * 1.7) * POINT_DEPTH_AMPLITUDE;
        point.depthZ = point.sphereDepth !== undefined ? lerp(breatheDepthZ, point.sphereDepth, sphere) : breatheDepthZ;
        point.scale = DEPTH_FOCAL / (DEPTH_FOCAL + point.depthZ);
        activePoints.push(point);
      }
    }

    // Настоящие столкновения: соседей ищем через сетку (иначе на тысячах
    // точек это слишком медленно), пару разбираем один раз — по возрастанию
    // id, чтобы не отталкивать друг от друга дважды за кадр. Отталкивание —
    // упругий удар равных масс: вдоль линии центров скорости обмениваются,
    // поэтому сила и направление толчка равны скорости сближения точек.
    // При каждом ударе обе точки вспыхивают белым на FLASH_MS.
    function resolveCollisions() {
      collideGrid.clear();
      for (const point of activePoints) {
        const gx = Math.floor(point.px / COLLIDE_CELL);
        const gy = Math.floor(point.py / COLLIDE_CELL);
        const key = gx * 4096 + gy;
        const bucket = collideGrid.get(key);
        if (bucket) bucket.push(point);
        else collideGrid.set(key, [point]);
      }

      const now = millis();

      for (const point of activePoints) {
        const gx = Math.floor(point.px / COLLIDE_CELL);
        const gy = Math.floor(point.py / COLLIDE_CELL);

        for (let ox = -1; ox <= 1; ox++) {
          for (let oy = -1; oy <= 1; oy++) {
            const bucket = collideGrid.get((gx + ox) * 4096 + gy + oy);
            if (!bucket) continue;

            for (const other of bucket) {
              if (other.id <= point.id) continue;

              let dx = other.px - point.px;
              let dy = other.py - point.py;
              let dist = Math.hypot(dx, dy);
              if (dist >= COLLIDE_DIST) continue;

              if (dist < 0.0001) {
                // Центры совпали — берём угол из сеяного random(), а не делим на ноль.
                const angle = random(TWO_PI);
                dx = cos(angle);
                dy = sin(angle);
                dist = 1;
              }
              const nx = dx / dist;
              const ny = dy / dist;

              // Расходятся сами — трогать нечего, но контакт уже случился.
              const rvx = other.vx - point.vx;
              const rvy = other.vy - point.vy;
              const closingSpeed = -(rvx * nx + rvy * ny);
              if (closingSpeed <= 0) continue;

              // Упругий удар равных масс: обмен нормальной составляющей
              // скорости. Сила толчка равна скорости сближения точек.
              point.vx -= closingSpeed * nx;
              point.vy -= closingSpeed * ny;
              other.vx += closingSpeed * nx;
              other.vy += closingSpeed * ny;

              // Раздвигаем точки, чтобы они не залипали друг в друге.
              const overlap = (COLLIDE_DIST - dist) / 2;
              point.px -= nx * overlap;
              point.py -= ny * overlap;
              other.px += nx * overlap;
              other.py += ny * overlap;

              point.flashUntil = now + FLASH_MS;
              other.flashUntil = now + FLASH_MS;

              // Стеклянный звон — только когда сталкиваются точки одного
              // слова (у каждой точки её слово записано на рождении и не
              // меняется, так что сравнение надёжно). И даже тогда не на
              // каждое столкновение подряд: общий предохранитель между
              // звонами не даёт им слиться в шум, даже если точек одного
              // слова сталкивается очень много за один кадр.
              if (point.wordIndex === other.wordIndex && now - lastChimeAt >= CHIME_MIN_GAP_MS) {
                triggerGlassChime(closingSpeed);
                lastChimeAt = now;
              }
            }
          }
        }
      }
    }

    // Контурная фигура в правом нижнем углу: голова, позвоночник, две руки.
    // В покое руки опущены. Как только приходит сигнал с микрофона, руки
    // поднимаются к голове — фигура словно хватается за голову; чем громче
    // звук, тем выше и ближе к голове ложатся руки. Часть, которая ярче
    // отзывается на звук, ещё и светлеет, уходя в оранжевый.
    // Под фигурой одна тонкая линия — общая громкость. Текста нет.
    function drawPresenceBadge() {
      if (!presenceEnabled || !micStream) return;
      const x0 = width - 64;
      const y0 = height - 92;
      const base = color(PALETTE.muted);
      const hot = color(PALETTE.orange);
      const partColor = level => {
        const c = lerpColor(base, hot, constrain(level, 0, 1));
        c.setAlpha(110 + 145 * constrain(level, 0, 1));
        return c;
      };
      push();
      noFill();
      strokeCap(ROUND);
      strokeWeight(2);
      stroke(partColor(zones.head));
      circle(x0, y0, 12 + zones.head * 3);
      stroke(partColor(zones.torso));
      line(x0, y0 + 8, x0, y0 + 40);
      stroke(partColor(zones.left));
      line(x0 - 1, y0 + 14, lerp(x0 - 18, x0 - 6, zones.left), lerp(y0 + 34, y0 - 3, zones.left));
      stroke(partColor(zones.right));
      line(x0 + 1, y0 + 14, lerp(x0 + 18, x0 + 6, zones.right), lerp(y0 + 34, y0 - 3, zones.right));
      strokeWeight(2);
      stroke(base.levels[0], base.levels[1], base.levels[2], 90);
      line(x0 - 22, y0 + 54, x0 + 22, y0 + 54);
      stroke(partColor(soundLevel));
      line(x0 - 22, y0 + 54, x0 - 22 + 44 * constrain(soundLevel, 0, 1), y0 + 54);
      pop();
    }

    function drawDots(glow, trail) {
      noStroke();
      const context = drawingContext;
      const now = millis();
      for (const point of activePoints) {
        // Вспышка от столкновения перекрывает обычный цвет точки на 0,1с.
        const flashing = point.flashUntil > now;
        const r = flashing ? 255 : point.r;
        const g = flashing ? 255 : point.g;
        const b = flashing ? 255 : point.b;
        const a = flashing ? 255 : point.a;

        // Проекция глубины: физика (px, py, vx, vy) остаётся в исходной
        // плоскости, а на экран точка ложится растянутой от центра сцены на
        // свой масштаб глубины — так рождается параллакс объёма.
        const scale = point.scale;
        const sx = width / 2 + (point.px - width / 2) * scale;
        const sy = height / 2 + (point.py - height / 2) * scale;

        if (trail > 0) {
          const length = 72 * trail;
          const tx = width / 2 + (point.px - point.vx * length - width / 2) * scale;
          const ty = height / 2 + (point.py - point.vy * length - height / 2) * scale;
          stroke(r, g, b, a * trail * 0.42);
          strokeWeight(DOT_SIZE * point.breathe * scale * (0.55 + trail * 0.25));
          line(sx, sy, tx, ty);
          noStroke();
        }
        // На нуле остаётся только чёткое ядро точки. В остальных положениях
        // ореол — один непрерывный радиальный градиент, без видимых колец.
        if (glow > 0) {
          const radius = lerp(DOT_SIZE * 0.9, 10, glow) * point.breathe * scale * (flashing ? 1.6 : 1);
          const alpha = Math.round(a * glow * (flashing ? 0.32 : 0.18));
          const halo = context.createRadialGradient(
            sx, sy, 0,
            sx, sy, radius
          );
          halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha / 255})`);
          halo.addColorStop(0.32, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.48) / 255})`);
          halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
          context.fillStyle = halo;
          context.beginPath();
          context.arc(sx, sy, radius, 0, TWO_PI);
          context.fill();
        }
        fill(r, g, b, a);
        circle(sx, sy, DOT_SIZE * point.breathe * scale * (flashing ? 1.3 : 1));
      }
    }

    function setupHsbWheel() {
      const wheel = document.getElementById('hsbWheel');
      const dot = document.getElementById('hsbDot');
      if (!wheel || !dot) return;

      const placeDot = () => {
        const angle = radians(cloudHue - 90);
        const radius = (cloudSaturation / 100) * 18;
        dot.style.left = `${22 + cos(angle) * radius}px`;
        dot.style.top = `${22 + sin(angle) * radius}px`;
        wheel.setAttribute('aria-valuetext', `оттенок ${Math.round(cloudHue)}, насыщенность ${Math.round(cloudSaturation)}`);
      };
      placeHsbDot = placeDot;

      const chooseColor = event => {
        const rect = wheel.getBoundingClientRect();
        const dx = event.clientX - rect.left - rect.width / 2;
        const dy = event.clientY - rect.top - rect.height / 2;
        const radius = Math.min(Math.hypot(dx, dy), rect.width / 2);
        cloudSaturation = (radius / (rect.width / 2)) * 100;
        cloudHue = (degrees(atan2(dy, dx)) + 90 + 360) % 360;
        placeDot();
      };

      wheel.addEventListener('pointerdown', event => {
        wheel.setPointerCapture(event.pointerId);
        chooseColor(event);
      });
      wheel.addEventListener('pointermove', event => {
        if (event.buttons) chooseColor(event);
      });
      placeDot();
    }

    // Кнопка «Хаос»: каждому контролу блока «визуализация» — своё случайное
    // значение в его собственных границах (min/max берутся прямо с ползунка,
    // а не задаются повторно здесь), плюс случайные оттенок и насыщенность
    // HSB-круга. Кнопка ищется один раз и, если её нет на странице, ничего
    // не делает — не ломает остальную настройку.
    function randomizeVisualization() {
      const rangeInputs = document.querySelectorAll('#vizGroup input[type="range"]:not(#presence)');
      rangeInputs.forEach(input => {
        const lo = Number(input.min);
        const hi = Number(input.max);
        input.value = String(random(lo, hi));
      });
      cloudHue = random(0, 360);
      cloudSaturation = random(0, 100);
      if (placeHsbDot) placeHsbDot();
    }

    function setupChaosButton() {
      const btn = document.getElementById('chaosBtn');
      if (btn) btn.addEventListener('click', randomizeVisualization);
    }

    // Панель управления по умолчанию спрятана за левым краем экрана —
    // кнопка в углу выдвигает и задвигает её, картинка на сцене не задета.
    function setupControlsPanel() {
      const panel = document.getElementById('controls');
      const toggle = document.getElementById('controlsToggle');
      if (!panel || !toggle) return;
      toggle.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggle.textContent = open ? '✕' : '☰';
      });
    }

    // Кнопка сама по себе только переключает намерение пользователя
    // (presenceEnabled) — включать ли микрофон вообще. Фактическое «слушает
    // ли микрофон прямо сейчас» показывает точка рядом: она берётся не
    // отсюда, а из updatePresence(), которая знает, дал ли браузер доступ.
    function setupPresenceToggle() {
      if (!presenceToggleBtn) return;
      presenceToggleBtn.addEventListener('click', () => {
        presenceEnabled = !presenceEnabled;
        updatePresenceToggleUI();
      });
      updatePresenceToggleUI();
    }

    function updatePresenceToggleUI() {
      if (!presenceToggleBtn) return;
      presenceToggleBtn.classList.toggle('live', !!micStream);
      presenceToggleBtn.setAttribute('aria-pressed', presenceEnabled ? 'true' : 'false');
      if (presenceToggleLabel) {
        presenceToggleLabel.textContent = presenceEnabled ? 'микрофон: вкл' : 'микрофон: выкл';
      }
    }

    // Кнопка «звук» устроена так же, как кнопка «микрофон»: сама она только
    // переключает намерение (soundOutputEnabled), а точка рядом загорается,
    // только когда звук и вправду разблокирован (audioReady — это случается
    // один раз, при первом клике или нажатии клавиши где угодно на странице).
    function setupSoundToggle() {
      if (!soundToggleBtn) return;
      soundToggleBtn.addEventListener('click', () => {
        soundOutputEnabled = !soundOutputEnabled;
        updateSoundToggleUI();
      });
      updateSoundToggleUI();
    }

    function updateSoundToggleUI() {
      if (!soundToggleBtn) return;
      soundToggleBtn.classList.toggle('live', soundOutputEnabled && audioReady);
      soundToggleBtn.setAttribute('aria-pressed', soundOutputEnabled ? 'true' : 'false');
      if (soundToggleLabel) {
        soundToggleLabel.textContent = soundOutputEnabled ? 'звук: вкл' : 'звук: выкл';
      }
    }

    // Линии между соседними точками: короткие связи внутри массы, они тянутся
    // за потоком и гаснут с расстоянием, поэтому не читаются как царапины.
    function drawLinks(linkShare) {
      linkGrid.clear();
      for (const point of activePoints) {
        const key = (Math.floor(point.px / LINK_RADIUS)) * 4096 +
          Math.floor(point.py / LINK_RADIUS);
        const bucket = linkGrid.get(key);
        if (bucket) bucket.push(point);
        else linkGrid.set(key, [point]);
      }

      strokeWeight(1);
      noFill();

      for (const point of activePoints) {
        if (point.linkRank > linkShare) continue;

        const gx = Math.floor(point.px / LINK_RADIUS);
        const gy = Math.floor(point.py / LINK_RADIUS);
        let best = null;
        let bestDist = 0;
        let bestScore = Infinity;

        // Ищем соседа не ближайшего, а на заметном расстоянии: короткие связи
        // между соседними точками одного штриха на экране не видны.
        for (let ox = -1; ox <= 1; ox++) {
          for (let oy = -1; oy <= 1; oy++) {
            const bucket = linkGrid.get((gx + ox) * 4096 + gy + oy);
            if (!bucket) continue;
            for (const other of bucket) {
              if (other === point) continue;
              const dx = other.px - point.px;
              const dy = other.py - point.py;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < LINK_MIN || dist > LINK_RADIUS) continue;
              const score = Math.abs(dist - LINK_WANTED);
              if (score < bestScore) {
                bestScore = score;
                bestDist = dist;
                best = other;
              }
            }
          }
        }

        if (!best) continue;
        const fade = 1 - 0.55 * ((bestDist - LINK_MIN) / (LINK_RADIUS - LINK_MIN));
        stroke(
          (point.r + best.r) / 2,
          (point.g + best.g) / 2,
          (point.b + best.b) / 2,
          Math.min(point.a, best.a) * 0.5 * fade
        );
        // Оба конца связи проецируются через свой масштаб глубины — если
        // одна точка сейчас ближе к камере, а другая дальше, линия между
        // ними тоже читается уходящей в объём, а не плоской.
        const psx = width / 2 + (point.px - width / 2) * point.scale;
        const psy = height / 2 + (point.py - height / 2) * point.scale;
        const bsx = width / 2 + (best.px - width / 2) * best.scale;
        const bsy = height / 2 + (best.py - height / 2) * best.scale;
        line(psx, psy, bsx, bsy);
      }
      noStroke();
    }
  </script>
</body>
</html>
