<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genesis - Birth of the Universe v.2.0</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.13/p5.min.js" defer></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e0f12;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #8a8f99;
      font: 13px/1.2 'PT Mono', monospace;
    }
    #stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      max-width: 100%;
      aspect-ratio: 16 / 9;
    }
    /* WebGL-слой с точками лежит точно поверх p5-канвы и не ловит мышь. */
    #pointsLayer {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    /* Отладочная панель справа под FPS; клавиша D прячет и показывает. */
    #debugPanel {
      position: absolute;
      top: 5.5%;
      right: 1.1%;
      z-index: 5;
      margin: 0;
      padding: 8px 10px;
      background: rgba(14, 15, 18, 0.78);
      border: 1px solid #22242b;
      border-radius: 6px;
      color: #8a8f99;
      font: 11px/1.45 'PT Mono', monospace;
      white-space: pre;
      pointer-events: none;
    }
    #controlsToggle {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 21;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14161b;
      border: 1px solid #2c2f38;
      border-radius: 6px;
      color: #e6e8ee;
      font: 16px/1 'PT Mono', monospace;
      cursor: pointer;
    }
    #controlsToggle:hover {
      border-color: #ff7a50;
      color: #ff7a50;
    }
    #controls {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      height: 100%;
      width: min(84vw, 300px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 22px;
      padding: 60px 16px 16px;
      background: rgba(14, 15, 18, 0.2);
      border-right: 1px solid #22242b;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    #controls.open {
      transform: translateX(0);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .group-title {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5a5f69;
    }
    .group-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }
    .group-body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }
    .chaos-frame {
      margin-top: auto;
      padding: 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chaos-btn {
      background: linear-gradient(180deg, #ff9a3d, #ff7a10);
      border: 1px solid #a8480a;
      border-radius: 6px;
      color: #2a1400;
      font: 700 13px/1.2 'PT Mono', monospace;
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 3px 0 #9a3f08, 0 5px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transform: translateY(0);
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease, color 0.15s ease;
    }
    .chaos-btn:hover {
      background: linear-gradient(180deg, #ffe066, #ffcc00);
      border-color: #cc9900;
      color: #2a2000;
    }
    .chaos-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #9a3f08, inset 0 2px 5px rgba(0, 0, 0, 0.4);
    }
    .mic-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #14161b;
      border: 1px solid #2c2f38;
      border-radius: 6px;
      color: #8a8f99;
      font: 13px/1.2 'PT Mono', monospace;
      padding: 9px 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .mic-toggle:hover {
      border-color: #ff7a50;
      color: #e6e8ee;
    }
    .mic-toggle-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #3a3d45;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .mic-toggle.live .mic-toggle-dot {
      background: #ff7a50;
      box-shadow: 0 0 8px 2px rgba(255, 122, 80, 0.65);
    }
    .midi-hint {
      font-size: 11px;
      line-height: 1.4;
      color: #5a5f69;
    }
    body.midi-learning #controls label:hover,
    body.midi-learning #chaosBtn:hover,
    body.midi-learning #presenceToggle:hover,
    body.midi-learning #soundToggle:hover,
    body.midi-learning #controlsToggle:hover {
      outline: 2px dashed #ff7a50;
      outline-offset: 2px;
      cursor: crosshair;
    }
    .midi-armed {
      outline: 2px solid #ff7a50;
      outline-offset: 2px;
      animation: midiPulse 0.9s ease-in-out infinite;
    }
    @keyframes midiPulse {
      0%, 100% { outline-color: #ff7a50; }
      50% { outline-color: #ffe066; }
    }
    .midi-live {
      background: rgba(255, 122, 80, 0.18);
      border-radius: 4px;
      transition: background 0.18s ease;
    }
    #controls label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    #controls input[type="range"] {
      flex: 1 1 120px;
      min-width: 90px;
      width: auto;
      accent-color: #ff7a50;
    }
    #controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff7a50;
      cursor: pointer;
    }
    .control-value {
      display: inline-block;
      min-width: 2.6em;
      color: #ff7a50;
      font-variant-numeric: tabular-nums;
    }
    #controls .hsb-control {
      gap: 9px;
    }
    .hsb-wheel {
      position: relative;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      cursor: crosshair;
      touch-action: none;
      background:
        radial-gradient(circle, #e6e8ee 0 0, transparent 70%),
        conic-gradient(#ff5050, #ff7a50, #ffe650, #58e878, #55dfff, #5aa9ff, #bd72ff, #ff5aa8, #ff5050);
    }
    .hsb-wheel::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, #e6e8ee 0, transparent 10%, transparent 100%);
      pointer-events: none;
    }
    .hsb-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid #e6e8ee;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #0e0f12;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Слова, собранные в строгую сетку и превращающиеся в точки"></main>
  <button id="controlsToggle" type="button" aria-label="Показать или скрыть панель управления">☰</button>

  <div id="controls">
    <div class="control-group">
      <div class="group-title">жизнь</div>
      <div class="group-body">
        <div class="group-row" id="vizGroup">
          <label>плотность точек
            <input id="density" type="range" min="0" max="100" value="21" />
            <span class="control-value" id="densityValue">21</span>
          </label>
          <label>скорость движения
            <input id="speed" type="range" min="0" max="200" value="189" />
            <span class="control-value" id="speedValue">189</span>
          </label>
          <label>вихрь
            <input id="vortex" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="vortexValue">0</span>
          </label>
          <label>сфера
            <input id="sphere" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="sphereValue">0</span>
          </label>
          <label>удаленность
            <input id="distance" type="range" min="0" max="100" value="18" />
            <span class="control-value" id="distanceValue">18</span>
          </label>
          <label>связность
            <input id="cohesion" type="range" min="0" max="100" value="37" />
            <span class="control-value" id="cohesionValue">37</span>
          </label>
          <label>количество линий
            <input id="links" type="range" min="0" max="100" value="91" />
            <span class="control-value" id="linksValue">91</span>
          </label>
          <label>свечение
            <input id="glow" type="range" min="0" max="100" value="92" />
            <span class="control-value" id="glowValue">92</span>
          </label>
          <label>шлейф
            <input id="trail" type="range" min="0" max="100" value="25" />
            <span class="control-value" id="trailValue">25</span>
          </label>
          <label class="hsb-control">HSB облака
            <span id="hsbWheel" class="hsb-wheel" role="slider" aria-label="Оттенок и насыщенность облака точек">
              <span id="hsbDot" class="hsb-dot"></span>
            </span>
          </label>
          <label>чувствительность HSB
            <input id="hsbMix" type="range" min="0" max="100" value="10" />
            <span class="control-value" id="hsbMixValue">10</span>
          </label>
        </div>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">звёзды</div>
      <div class="group-row">
        <label>звёзды вкл
          <input id="starEnabled" type="checkbox" />
        </label>
        <label>скорость звёзд
          <input id="starSpeed" type="range" min="0" max="100" value="17" />
          <span class="control-value" id="starSpeedValue">17</span>
        </label>
        <label>контраст звёзд
          <input id="starContrast" type="range" min="0" max="100" value="100" />
          <span class="control-value" id="starContrastValue">100</span>
        </label>
        <label>яркость звёзд
          <input id="starBrightness" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starBrightnessValue">0</span>
        </label>
        <label>вращение звёзд
          <input id="starSpin" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starSpinValue">0</span>
        </label>
        <label>движение вперёд
          <input id="starForward" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starForwardValue">0</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">синяя планета</div>
      <div class="group-row">
        <label>масса планеты
          <input id="planetMass" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planetMassValue">0</span>
        </label>
        <label>скорость вращения
          <input id="planetSpeed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planetSpeedValue">0</span>
        </label>
        <label>орбита
          <input id="planetDistance" type="range" min="0" max="100" value="23" />
          <span class="control-value" id="planetDistanceValue">23</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">красная планета</div>
      <div class="group-row">
        <label>масса планеты
          <input id="planet2Mass" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planet2MassValue">0</span>
        </label>
        <label>скорость вращения
          <input id="planet2Speed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planet2SpeedValue">0</span>
        </label>
        <label>орбита
          <input id="planet2Distance" type="range" min="0" max="100" value="21" />
          <span class="control-value" id="planet2DistanceValue">21</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">точка вращения</div>
      <div class="group-row">
        <label>притяжение
          <input id="sunAttraction" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="sunAttractionValue">0</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">звук</div>
      <div class="group-row">
        <button id="soundToggle" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="soundToggleLabel">звук: выкл</span>
        </button>
        <label>громкость
          <input id="volume" type="range" min="0" max="100" value="50" />
          <span class="control-value" id="volumeValue" data-suffix="%">50%</span>
        </label>
        <label>частота
          <input id="frequency" type="range" min="0" max="100" value="15" />
          <span class="control-value" id="frequencyValue" data-suffix="%">15%</span>
        </label>
        <label>дилей
          <input id="delay" type="range" min="0" max="100" value="60" />
          <span class="control-value" id="delayValue" data-suffix="%">60%</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">присутствие</div>
      <div class="group-row">
        <label>чувствительность
          <input id="presence" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="presenceValue">0</span>
        </label>
        <button id="presenceToggle" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="presenceToggleLabel">микрофон: выкл</span>
        </button>
      </div>
    </div>
    <div class="control-group" id="midiGroup">
      <div class="group-title">MIDI-контроллер (Akai MPK25)</div>
      <div class="group-row">
        <button id="midiConnectBtn" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="midiConnectLabel">MIDI: выкл</span>
        </button>
        <button id="midiLearnBtn" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="midiLearnLabel">Learn: выкл</span>
        </button>
        <button id="midiResetBtn" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span>Сбросить MIDI</span>
        </button>
        <div class="midi-hint" id="midiHint">Нажми «Подключить MIDI», затем «Learn», выбери ползунок или кнопку на экране и покрути ручку либо нажми пэд на контроллере.</div>
      </div>
    </div>
    <div class="chaos-frame">
      <button id="chaosBtn" type="button" class="chaos-btn">Хаос</button>
    </div>
  </div>

  <script>
    const PALETTE = {
      background: '#0e0f12',
      light: '#e6e8ee',
      muted: '#8a8f99',
      orange: '#ff7a50',
      blue: '#5aa9ff'
    };

    const INTRO_MS = 60000;
    const WORD_DISSOLVE_SPEEDUP = 2;
    const INTRO_GLOW_BASE = 70;
    const INTRO_START_ALPHA = 0.85;
    const GLOW_COLORS = [PALETTE.blue, '#2ecc8f', PALETTE.light, '#ff5c5c', '#ffd166'];

    function sampleGlowColor(t) {
      const clamped = constrain(t, 0, 1);
      const scaled = clamped * (GLOW_COLORS.length - 1);
      const idx = Math.min(GLOW_COLORS.length - 2, Math.floor(scaled));
      const localT = scaled - idx;
      return lerpColor(color(GLOW_COLORS[idx]), color(GLOW_COLORS[idx + 1]), localT);
    }

    // ===================== config.txt: проценты по умолчанию =====================
    // Каждый блок конфига выглядит как "[Название] id=xxx" и где-то ниже —
    // строка "default: NN%". Один id — одно число в процентах (0-100 =
    // положение ползунка от левого до правого края, как описано в шапке
    // самого config.txt). Если файл недоступен (страница открыта двойным
    // кликом как file://, без сервера — так и задумано в README), просто
    // остаёмся на значениях value="" из HTML ниже.
    function parseConfigDefaults(lines) {
      const result = {};
      const headerRe = /^\[.*\]\s+id=([A-Za-z0-9_]+)/;
      const defaultRe = /^\s*default:\s*([\d.]+)\s*%/;
      let currentId = null;
      for (const line of lines) {
        const h = headerRe.exec(line);
        if (h) { currentId = h[1]; continue; }
        if (currentId) {
          const d = defaultRe.exec(line);
          if (d) {
            result[currentId] = parseFloat(d[1]);
            currentId = null;
          }
        }
      }
      return result;
    }

    // Чекбоксы: 0% = выключено, 100% = включено.
    const CONFIG_CHECKBOX_IDS = ['starEnabled'];

    // Чтение config.txt намеренно вынесено из preload()/setup() p5 - если
    // fetch зависнет или упадёт (например, при открытии двойным кликом как
    // file://, где сосед-файл читать нельзя), это никак не блокирует p5:
    // страница просто останется на value="" из HTML, без бесконечного
    // "Loading...".
    function loadConfigDefaultsFromFile() {
      try {
        fetch('config.txt')
          .then((res) => (res && res.ok) ? res.text() : Promise.reject(new Error('config.txt: ' + (res && res.status))))
          .then((text) => {
            configDefaults = parseConfigDefaults(text.split(/\r?\n/));
            applyConfigDefaults();
          })
          .catch(() => { configDefaults = null; });
      } catch (err) {
        configDefaults = null;
      }
    }

    function applyConfigDefaults() {
      if (!configDefaults) return;
      for (const id of CONFIG_SLIDER_IDS) {
        const pct = configDefaults[id];
        if (!Number.isFinite(pct)) continue;
        const input = document.getElementById(id);
        if (!input) continue;
        const min = Number(input.min) || 0;
        const max = Number(input.max) || 100;
        const clamped = Math.min(100, Math.max(0, pct));
        input.value = String(Math.round(min + (clamped / 100) * (max - min)));
      }
      for (const id of CONFIG_CHECKBOX_IDS) {
        const pct = configDefaults[id];
        if (!Number.isFinite(pct)) continue;
        const input = document.getElementById(id);
        if (!input) continue;
        input.checked = pct >= 50;
      }
      // звук и микрофон — сознательно не трогаем: браузер разрешает
      // включить AudioContext/микрофон только по жесту пользователя, поэтому
      // "default" для soundToggle/presenceToggle в конфиге остаётся только
      // документацией и не применяется автоматически.
    }

    loadConfigDefaultsFromFile();

    function preload() {
      try {
        introGlyphImg = loadImage(
          TIGLE_GLYPH_DATA_URI,
          () => { introGlyphReady = true; },
          () => { introGlyphReady = false; }
        );
      } catch (err) {
        introGlyphReady = false;
      }
    }

    // ===================== MIDI: Akai MPK25 и любой Web MIDI контроллер =====================
    // Режим "Learn": жмём Learn -> кликаем по ползунку/чекбоксу/кнопке на экране ->
    // крутим ручку или жмём пэд на контроллере - связка запоминается в localStorage.
    // Банки ручек на самом MPK25 (A/B/C/D) переключают номера CC у одних и тех же
    // физических ручек - так можно привязать больше 8 ползунков, просто переключая
    // банк на контроллере и заново привязывая нужные ручки через Learn.
    const MIDI_STORAGE_KEY = 'birthMidiMap_v1';
    const MIDI_ACTIONS = {
      chaosBtn: () => document.getElementById('chaosBtn')?.click(),
      presenceToggle: () => document.getElementById('presenceToggle')?.click(),
      soundToggle: () => document.getElementById('soundToggle')?.click(),
      controlsToggle: () => document.getElementById('controlsToggle')?.click()
    };
    const MIDI_ACTION_NAMES = {
      chaosBtn: 'Хаос',
      presenceToggle: 'микрофон вкл/выкл',
      soundToggle: 'звук вкл/выкл',
      controlsToggle: 'показать/скрыть панель'
    };
    let midiAccess = null;
    let midiLearnMode = false;
    let midiArmedTarget = null;
    let midiMap = {};
    let midiCcEdgeState = {};
    let midiHintEl = null;

    function midiLoadMap() {
      try {
        const raw = localStorage.getItem(MIDI_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (err) {
        return {};
      }
    }

    function midiSaveMap() {
      try {
        localStorage.setItem(MIDI_STORAGE_KEY, JSON.stringify(midiMap));
      } catch (err) {
        // хранилище недоступно - привязки просто не переживут перезагрузку страницы
      }
    }

    function midiFindLearnable(el) {
      if (!el || !el.closest) return null;
      const label = el.closest('#controls label');
      if (label) {
        const input = label.querySelector('input[type="range"], input[type="checkbox"]');
        if (input && input.id) return { kind: 'range', id: input.id, input };
      }
      const actionEl = el.closest('#chaosBtn, #presenceToggle, #soundToggle, #controlsToggle');
      if (actionEl && MIDI_ACTIONS[actionEl.id]) {
        return { kind: 'action', id: actionEl.id, input: actionEl };
      }
      return null;
    }

    function midiDescribeTarget(target) {
      if (!target) return '';
      if (target.kind === 'action') return MIDI_ACTION_NAMES[target.id] || target.id;
      const label = target.input && target.input.closest ? target.input.closest('label') : null;
      if (label) {
        const text = Array.from(label.childNodes)
          .filter(node => node.nodeType === 3)
          .map(node => node.textContent.trim())
          .join(' ')
          .trim();
        if (text) return text;
      }
      return target.id;
    }

    function midiSetArmed(target, on) {
      if (!target || !target.input) return;
      const el = target.kind === 'range' ? (target.input.closest('label') || target.input) : target.input;
      el.classList.toggle('midi-armed', on);
    }

    function midiFlash(el) {
      if (!el) return;
      el.classList.add('midi-live');
      clearTimeout(el._midiFlashTimer);
      el._midiFlashTimer = setTimeout(() => el.classList.remove('midi-live'), 180);
    }

    function midiApplyValue(binding, value, source) {
      if (!binding) return;
      if (binding.kind === 'range') {
        const input = document.getElementById(binding.id);
        if (!input) return;
        if (input.type === 'checkbox') {
          input.checked = value >= 64;
        } else {
          const min = Number(input.min);
          const max = Number(input.max);
          input.value = String(min + (value / 127) * (max - min));
        }
        midiFlash(input.closest('label') || input);
        return;
      }
      if (binding.kind === 'action') {
        if (source === 'note') {
          MIDI_ACTIONS[binding.id]?.();
          midiFlash(document.getElementById(binding.id));
          return;
        }
        // CC на кнопке: срабатывает один раз при переходе через середину хода
        // ручки, чтобы не щёлкать по многу раз, пока ручку крутят.
        const prev = midiCcEdgeState[binding.id] || 0;
        if (value >= 64 && prev < 64) {
          MIDI_ACTIONS[binding.id]?.();
          midiFlash(document.getElementById(binding.id));
        }
        midiCcEdgeState[binding.id] = value;
      }
    }

    function midiOnEvent(source, num, value) {
      const key = source + ':' + num;
      if (midiLearnMode && midiArmedTarget) {
        const target = midiArmedTarget;
        midiMap[key] = { kind: target.kind, id: target.id };
        midiSaveMap();
        midiSetArmed(target, false);
        midiArmedTarget = null;
        if (midiHintEl) {
          midiHintEl.textContent = midiDescribeTarget(target) + ' <- ' +
            (source === 'cc' ? 'ручка, CC ' : 'пэд, нота ') + num +
            '. Выбери следующий элемент или выключи Learn.';
        }
        return;
      }
      midiApplyValue(midiMap[key], value, source);
    }

    function midiOnMessage(event) {
      const data = event.data;
      if (!data || data.length < 2) return;
      const status = data[0];
      const type = status & 0xf0;
      if (type === 0xb0) {
        midiOnEvent('cc', data[1], data[2] || 0);
      } else if (type === 0x90 && (data[2] || 0) > 0) {
        midiOnEvent('note', data[1], data[2]);
      }
    }

    function midiAttachInputs(connectBtn, connectLabel) {
      if (!midiAccess) return;
      const names = [];
      for (const input of midiAccess.inputs.values()) {
        input.onmidimessage = midiOnMessage;
        names.push(input.name || 'MIDI-устройство');
      }
      if (names.length === 0) {
        if (connectLabel) connectLabel.textContent = 'MIDI: контроллер не найден';
        connectBtn.classList.remove('live');
        connectBtn.setAttribute('aria-pressed', 'false');
        return;
      }
      const mpk = names.find(name => /mpk/i.test(name));
      if (connectLabel) connectLabel.textContent = 'MIDI: ' + (mpk || names.join(', '));
      connectBtn.classList.add('live');
      connectBtn.setAttribute('aria-pressed', 'true');
    }

    function setupMidiControl() {
      const connectBtn = document.getElementById('midiConnectBtn');
      const connectLabel = document.getElementById('midiConnectLabel');
      const learnBtn = document.getElementById('midiLearnBtn');
      const learnLabel = document.getElementById('midiLearnLabel');
      const resetBtn = document.getElementById('midiResetBtn');
      midiHintEl = document.getElementById('midiHint');
      if (!connectBtn || !learnBtn || !resetBtn) return;

      midiMap = midiLoadMap();

      connectBtn.addEventListener('click', async () => {
        if (!navigator.requestMIDIAccess) {
          if (connectLabel) connectLabel.textContent = 'MIDI: браузер не поддерживает';
          return;
        }
        try {
          midiAccess = await navigator.requestMIDIAccess({ sysex: false });
          midiAttachInputs(connectBtn, connectLabel);
          midiAccess.onstatechange = () => midiAttachInputs(connectBtn, connectLabel);
        } catch (err) {
          if (connectLabel) connectLabel.textContent = 'MIDI: доступ запрещён';
        }
      });

      learnBtn.addEventListener('click', () => {
        midiLearnMode = !midiLearnMode;
        document.body.classList.toggle('midi-learning', midiLearnMode);
        learnBtn.classList.toggle('live', midiLearnMode);
        learnBtn.setAttribute('aria-pressed', midiLearnMode ? 'true' : 'false');
        if (learnLabel) learnLabel.textContent = midiLearnMode ? 'Learn: вкл' : 'Learn: выкл';
        if (!midiLearnMode && midiArmedTarget) {
          midiSetArmed(midiArmedTarget, false);
          midiArmedTarget = null;
        }
        if (midiHintEl) {
          midiHintEl.textContent = midiLearnMode
            ? 'Клик по ползунку, чекбоксу или кнопке на экране - затем крути ручку или жми пэд на контроллере.'
            : 'Нажми «Подключить MIDI», затем «Learn», выбери элемент и покрути ручку/нажми пэд на Akai MPK25.';
        }
      });

      resetBtn.addEventListener('click', () => {
        midiMap = {};
        midiCcEdgeState = {};
        midiSaveMap();
        if (midiHintEl) midiHintEl.textContent = 'Все привязки MIDI сброшены.';
      });

      document.addEventListener('click', event => {
        if (!midiLearnMode) return;
        const target = midiFindLearnable(event.target);
        if (!target) return;
        event.preventDefault();
        event.stopPropagation();
        if (midiArmedTarget) midiSetArmed(midiArmedTarget, false);
        midiArmedTarget = target;
        midiSetArmed(midiArmedTarget, true);
        if (midiHintEl) midiHintEl.textContent = 'Ждём сигнал для «' + midiDescribeTarget(target) + '»...';
      }, true);
    }

    // ===================== Отладочная панель (клавиша D) =====================
    // Справа под FPS: сколько ядер у машины и какие из них заняты этой
    // страницей, сколько миллисекунд кадра и какую долю бюджета 30 fps
    // (33,3 мс) съедает каждый процесс и какие ползунки на него влияют.
    // Обновляется раз в секунду. Загрузку отдельных ядер браузер не
    // сообщает - поэтому показано то, что можно измерить честно: время
    // главного потока (в нём идёт весь расчёт) и, если браузер позволяет,
    // время видеокарты на слой точек.
    const DEBUG_FRAME_BUDGET_MS = 1000 / 30;
    const DEBUG_STAGES = [
      { key: 'physics', label: 'движение точек', controls: 'плотность, скорость, вихрь, сфера, связность, планеты' },
      { key: 'collide', label: 'столкновения', controls: 'плотность' },
      { key: 'links', label: 'линии связи', controls: 'количество линий, плотность' },
      { key: 'dots', label: 'точки: подготовка', controls: 'свечение, шлейф, HSB, плотность' },
      { key: 'stars', label: 'звёзды', controls: 'блок «звёзды»' },
      { key: 'planets', label: 'планеты и солнце', controls: 'масса, скорость, орбита, притяжение' },
      { key: 'field', label: 'поле течения', controls: '-' },
      { key: 'intro', label: 'вступление', controls: 'первые 60 с' },
      { key: 'mic', label: 'микрофон', controls: 'чувствительность' },
      { key: 'other', label: 'фон, HSB, панель', controls: '-' }
    ];

    let debugVisible = true;
    let debugPanelEl = null;
    const debugAcc = {};
    let debugFrames = 0;
    let debugJsMs = 0;
    let debugWindowStart = 0;
    let debugFrameStart = 0;
    let debugMarkAt = 0;
    const debugGpu = { gl: null, ext: null, query: null, sumMs: 0, samples: 0 };

    function setupDebugPanel() {
      debugPanelEl = document.createElement('pre');
      debugPanelEl.id = 'debugPanel';
      debugPanelEl.textContent = 'отладка: собираю данные...';
      document.getElementById('stage').appendChild(debugPanelEl);
      for (const stage of DEBUG_STAGES) debugAcc[stage.key] = 0;
      window.addEventListener('keydown', event => {
        if (event.code !== 'KeyD' || event.metaKey || event.ctrlKey || event.altKey) return;
        debugVisible = !debugVisible;
        debugPanelEl.style.display = debugVisible ? '' : 'none';
      });
      debugWindowStart = performance.now();
    }

    function debugBeginFrame() {
      debugFrameStart = performance.now();
      debugMarkAt = debugFrameStart;
    }

    // Всё время с прошлой отметки записывается на счёт процесса key.
    function debugMark(key) {
      const now = performance.now();
      debugAcc[key] += now - debugMarkAt;
      debugMarkAt = now;
    }

    function debugEndFrame() {
      if (!debugPanelEl) return;
      const now = performance.now();
      debugJsMs += now - debugFrameStart;
      debugFrames++;
      const elapsed = now - debugWindowStart;
      if (elapsed < 1000) return;
      if (debugVisible) renderDebugPanel(elapsed);
      for (const stage of DEBUG_STAGES) debugAcc[stage.key] = 0;
      debugFrames = 0;
      debugJsMs = 0;
      debugGpu.sumMs = 0;
      debugGpu.samples = 0;
      debugWindowStart = now;
    }

    // Время видеокарты на слой точек (расширение EXT_disjoint_timer_query).
    // Одновременно в работе один замер - результат забираем, когда готов.
    function debugGpuBegin(gl) {
      if (!debugVisible) return false;
      const g = debugGpu;
      if (g.gl !== gl) {
        g.gl = gl;
        g.ext = gl.getExtension('EXT_disjoint_timer_query');
        g.query = null;
      }
      const ext = g.ext;
      if (!ext) return false;
      if (g.query) {
        const available = ext.getQueryObjectEXT(g.query, ext.QUERY_RESULT_AVAILABLE_EXT);
        const disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
        if (!available && !disjoint) return false;
        if (available && !disjoint) {
          g.sumMs += ext.getQueryObjectEXT(g.query, ext.QUERY_RESULT_EXT) / 1e6;
          g.samples++;
        }
        ext.deleteQueryEXT(g.query);
        g.query = null;
      }
      g.query = ext.createQueryEXT();
      ext.beginQueryEXT(ext.TIME_ELAPSED_EXT, g.query);
      return true;
    }

    function debugGpuEnd(started) {
      if (started) debugGpu.ext.endQueryEXT(debugGpu.ext.TIME_ELAPSED_EXT);
    }

    function renderDebugPanel(elapsed) {
      const frames = Math.max(1, debugFrames);
      const fmt = (v, digits) => v.toFixed(digits);
      const jsPerFrame = debugJsMs / frames;
      const coreLoad = (debugJsMs / elapsed) * 100;
      const cores = navigator.hardwareConcurrency || '?';
      const audioOn = soundOutputEnabled || presenceEnabled;
      const lines = [];
      lines.push('ОТЛАДКА                                   D - скрыть');
      lines.push('ядра процессора: ' + cores + ' логических в системе');
      lines.push('заняты страницей: 1 поток расчёта (главный)' +
        (pointsLayer ? ' + видеокарта' : '') + (audioOn ? ' + аудиопоток' : ''));
      lines.push('главный поток: ' + fmt(jsPerFrame, 1) + ' мс на кадр = ' +
        Math.round(coreLoad) + '% одного ядра');
      let gpuLine = 'видеокарта, слой точек: ';
      if (!pointsLayer) gpuLine += 'выключен, точки рисуются в 2D';
      else if (!debugGpu.ext) gpuLine += 'браузер не даёт замерить';
      else if (debugGpu.samples === 0) gpuLine += 'замер...';
      else gpuLine += fmt(debugGpu.sumMs / debugGpu.samples, 2) + ' мс на кадр';
      lines.push(gpuLine);
      const fpsNow = (debugFrames * 1000) / elapsed;
      lines.push('кадров в секунду: ' + fmt(fpsNow, 1) + ' (цель 30, бюджет кадра 33,3 мс)');
      if (fpsNow >= 28.5) lines.push('итог: 30 fps держатся');
      else if (jsPerFrame > 25) lines.push('итог: не успевает расчёт в главном потоке');
      else lines.push('итог: расчёт успевает - тормозит отрисовка (видеокарта/браузер)');
      lines.push('');
      lines.push('процесс'.padEnd(20) + 'мс'.padStart(6) + '% кадра'.padStart(9) + '  от чего зависит');
      const rows = DEBUG_STAGES
        .map(stage => ({ stage, ms: debugAcc[stage.key] / frames }))
        .sort((a, b) => b.ms - a.ms);
      for (const row of rows) {
        const share = (row.ms / DEBUG_FRAME_BUDGET_MS) * 100;
        lines.push(
          row.stage.label.padEnd(20) +
          fmt(row.ms, 2).padStart(6) +
          (fmt(share, share < 10 ? 1 : 0) + '%').padStart(9) +
          '  ' + row.stage.controls
        );
      }
      const total = (jsPerFrame / DEBUG_FRAME_BUDGET_MS) * 100;
      lines.push('всего'.padEnd(20) + fmt(jsPerFrame, 2).padStart(6) + (Math.round(total) + '%').padStart(9) +
        '  запас ' + Math.max(0, Math.round(100 - total)) + '%');
      lines.push('');
      lines.push('экран x' + (window.devicePixelRatio || 1) + ' · чёткость точек x' + perfPixelDensity.toFixed(2) +
        ' (потолок x' + perfPixelDensityCeiling.toFixed(2) + ')');
      lines.push('точек в кадре: ' + activePoints.length + ' · плотность ' + Math.round(readControl(densityInput, 60)));
      debugPanelEl.textContent = lines.join('\n');
    }

// ===================== Производительность: под конкретную машину =====================
    // Канву 2D браузер не раскладывает по ядрам процессора, поэтому главное
    // ускорение сделано иначе: все точки (шлейф, свечение, ядро) рисует
    // видеокарта через WebGL-слой поверх p5-канвы (см. «Точки на видеокарте»).
    // Сама p5-канва (звёзды, планеты, линии) всегда в x1: её разгон до x2
    // вчетверо утяжелял кадр и раскачивал fps между 30 и 20.
    // Автомасштаб ниже меняет только чёткость слоя точек — это дёшево.
    const PERF_SAMPLE_MS = 1000;
    const PERF_LOW_FPS = 26;
    const PERF_HIGH_FPS = 29;
    let perfWindowFrames = 0;

    // Потолок чёткости слоя точек: не выше плотности пикселей экрана и не
    // выше того, что прикидываем по ядрам и памяти машины.
    function detectPerfCeiling() {
      const cores = navigator.hardwareConcurrency || 4;
      const mem = navigator.deviceMemory || 4; // ГБ; есть только в Chrome/Edge
      const screenDensity = window.devicePixelRatio || 1;
      let ceiling = 1;
      if (cores >= 8 && mem >= 8) ceiling = 2;
      else if (cores >= 4) ceiling = 1.5;
      return Math.max(1, Math.min(ceiling, screenDensity));
    }

    // Раз в секунду считает средний FPS за эту секунду (а не по одному
    // кадру, как frameRate()). Держится ниже 26 - чёткость слоя точек
    // снижается на шаг; держится 29+ - возвращается к потолку.
    function updatePerfScaling() {
      perfWindowFrames++;
      const now = millis();
      const elapsed = now - perfWindowStart;
      if (elapsed < PERF_SAMPLE_MS) return;
      perfCurrentFps = (perfWindowFrames * 1000) / elapsed;
      perfWindowStart = now;
      perfWindowFrames = 0;
      if (!pointsLayer) return; // без WebGL p5-канва остаётся в x1

      if (perfCurrentFps < PERF_LOW_FPS) {
        perfHighStreak = 0;
        perfLowStreak++;
        if (perfLowStreak >= 2 && perfPixelDensity > 1) {
          perfPixelDensity = Math.max(1, perfPixelDensity - 0.25);
          perfLowStreak = 0;
        }
      } else if (perfCurrentFps >= PERF_HIGH_FPS) {
        perfLowStreak = 0;
        perfHighStreak++;
        if (perfHighStreak >= 3 && perfPixelDensity < perfPixelDensityCeiling) {
          perfPixelDensity = Math.min(perfPixelDensityCeiling, perfPixelDensity + 0.25);
          perfHighStreak = 0;
        }
      } else {
        perfLowStreak = 0;
        perfHighStreak = 0;
      }
    }

    // Средний FPS, чёткость слоя точек и способ отрисовки (GL - видеокарта,
    // 2D - запасной путь без WebGL) в правом верхнем углу.
    function drawPerfHud() {
      push();
      noStroke();
      fill(138, 143, 153, 210);
      textAlign(RIGHT, TOP);
      textSize(12);
      text('FPS ' + Math.round(perfCurrentFps) + ' \u00b7 x' + perfPixelDensity.toFixed(2) +
        (pointsLayer ? ' \u00b7 GL' : ' \u00b7 2D'), width - 14, 14);
      pop();
    }

    function setup() {
      const canvas = createCanvas(1280, 720);
      canvas.parent('stage');
      pixelDensity(1);
      frameRate(30);
      randomSeed(7);
      noiseSeed(7);
      textFont('PT Mono');
      textAlign(CENTER, CENTER);
      noStroke();

      buildGlowSprites();
      buildIntroLayers();
      buildCloud();
      buildField();
      buildStars();
      densityInput = document.getElementById('density');
      speedInput = document.getElementById('speed');
      vortexInput = document.getElementById('vortex');
      sphereInput = document.getElementById('sphere');
      distanceInput = document.getElementById('distance');
      cohesionInput = document.getElementById('cohesion');
      linksInput = document.getElementById('links');
      glowInput = document.getElementById('glow');
      trailInput = document.getElementById('trail');
      starEnabledInput = document.getElementById('starEnabled');
      starSpeedInput = document.getElementById('starSpeed');
      starContrastInput = document.getElementById('starContrast');
      starBrightnessInput = document.getElementById('starBrightness');
      starSpinInput = document.getElementById('starSpin');
      starForwardInput = document.getElementById('starForward');
      presenceInput = document.getElementById('presence');
      volumeInput = document.getElementById('volume');
      frequencyInput = document.getElementById('frequency');
      soundToggleBtn = document.getElementById('soundToggle');
      soundToggleLabel = document.getElementById('soundToggleLabel');
      delayInput = document.getElementById('delay');
      hsbMixInput = document.getElementById('hsbMix');
      planetMassInput = document.getElementById('planetMass');
      planetSpeedInput = document.getElementById('planetSpeed');
      planetDistanceInput = document.getElementById('planetDistance');
      planet2MassInput = document.getElementById('planet2Mass');
      planet2SpeedInput = document.getElementById('planet2Speed');
      planet2DistanceInput = document.getElementById('planet2Distance');
      sunAttractionInput = document.getElementById('sunAttraction');
      presenceToggleBtn = document.getElementById('presenceToggle');
      presenceToggleLabel = document.getElementById('presenceToggleLabel');
      applyConfigDefaults();
      controlRangeInputs = Array.from(document.querySelectorAll('#controls input[type="range"]'));
      setupHsbWheel();
      setupChaosButton();
      setupControlsPanel();
      setupPresenceToggle();
      setupSoundToggle();
      setupMidiControl();
      setupChimeVoices();
      window.addEventListener('pointerdown', unlockAudioOnce);
      window.addEventListener('keydown', unlockAudioOnce);
      initPointsLayer();
      setupDebugPanel();
      startedAt = millis();
      perfWindowStart = startedAt;
    }

    // 32 маленьких спрайта свечения — цвета берутся из той же радуги
    // GLOW_COLORS, что и раньше, но каждый радиальный градиент строится
    // ровно один раз за загрузку, а не каждый кадр на каждую точку.
    function buildGlowSprites() {
      glowSprites = [];
      const R = 32;
      const size = R * 2;
      for (let i = 0; i < GLOW_BUCKETS; i++) {
        const t = i / (GLOW_BUCKETS - 1);
        const c = sampleGlowColor(t);
        const r = red(c), g = green(c), b = blue2(c);
        // Те же цвета корзин нужны WebGL-слою, который рисует свечение без спрайтов.
        glowBucketRGB[i * 3] = r / 255;
        glowBucketRGB[i * 3 + 1] = g / 255;
        glowBucketRGB[i * 3 + 2] = b / 255;
        const gfx = createGraphics(size, size);
        gfx.pixelDensity(1);
        gfx.clear();
        const ctx = gfx.drawingContext;
        const grad = ctx.createRadialGradient(R, R, 0, R, R, R);
        grad.addColorStop(0,    `rgba(${r},${g},${b},1)`);
        grad.addColorStop(0.32, `rgba(${r},${g},${b},0.48)`);
        grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(R, R, R, 0, Math.PI * 2);
        ctx.fill();
        glowSprites.push(gfx);
      }
    }

    // Отдельный спрайт для HSB-режима: одна одноцветная мгла, перестраивается
    // только когда меняется оттенок или насыщенность.
    function buildHsbGlowSprite() {
      const R = 32;
      const size = R * 2;
      if (!hsbGlowSprite) {
        hsbGlowSprite = createGraphics(size, size);
        hsbGlowSprite.pixelDensity(1);
      }
      hsbGlowSprite.clear();
      const ctx = hsbGlowSprite.drawingContext;
      const r = Math.round(cloudMixR);
      const g = Math.round(cloudMixG);
      const b = Math.round(cloudMixB);
      const grad = ctx.createRadialGradient(R, R, 0, R, R, R);
      grad.addColorStop(0,    `rgba(${r},${g},${b},1)`);
      grad.addColorStop(0.32, `rgba(${r},${g},${b},0.48)`);
      grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(R, R, R, 0, Math.PI * 2);
      ctx.fill();
      hsbGlowSpriteHue = cloudHue;
      hsbGlowSpriteSat = cloudSaturation;
    }

    function setupChimeVoices() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
        delayNode = audioCtx.createDelay(1.0);
        delayNode.delayTime.value = 0.26;
        delayFeedback = audioCtx.createGain();
        delayFeedback.gain.value = 0;
        delayWet = audioCtx.createGain();
        delayWet.gain.value = 0;
        delayNode.connect(delayFeedback).connect(delayNode);
        delayNode.connect(delayWet).connect(audioCtx.destination);
        for (let i = 0; i < CHIME_VOICES; i++) {
          const tone = audioCtx.createOscillator();
          const tonePartial = audioCtx.createOscillator();
          const toneThird = audioCtx.createOscillator();
          const toneFourth = audioCtx.createOscillator();
          const toneFifth = audioCtx.createOscillator();
          const toneOctave = audioCtx.createOscillator();
          const toneGain = audioCtx.createGain();
          const partialGain = audioCtx.createGain();
          const thirdGain = audioCtx.createGain();
          const fourthGain = audioCtx.createGain();
          const fifthGain = audioCtx.createGain();
          const octaveGain = audioCtx.createGain();
          tone.type = 'sine';
          tonePartial.type = 'sine';
          toneThird.type = 'sine';
          toneFourth.type = 'sine';
          toneFifth.type = 'sine';
          toneOctave.type = 'sine';
          toneGain.gain.value = 0;
          partialGain.gain.value = 0;
          thirdGain.gain.value = 0;
          fourthGain.gain.value = 0;
          fifthGain.gain.value = 0;
          octaveGain.gain.value = 0;
          tone.connect(toneGain).connect(audioCtx.destination);
          tonePartial.connect(partialGain).connect(audioCtx.destination);
          toneThird.connect(thirdGain).connect(audioCtx.destination);
          toneFourth.connect(fourthGain).connect(audioCtx.destination);
          toneFifth.connect(fifthGain).connect(audioCtx.destination);
          toneOctave.connect(octaveGain).connect(audioCtx.destination);
          toneGain.connect(delayNode);
          partialGain.connect(delayNode);
          thirdGain.connect(delayNode);
          fourthGain.connect(delayNode);
          fifthGain.connect(delayNode);
          octaveGain.connect(delayNode);
          tone.start();
          tonePartial.start();
          toneThird.start();
          toneFourth.start();
          toneFifth.start();
          toneOctave.start();
          chimeVoices.push({
            tone, partial: tonePartial, third: toneThird, fourth: toneFourth, fifth: toneFifth, octave: toneOctave,
            toneGain, partialGain, thirdGain, fourthGain, fifthGain, octaveGain
          });
        }
      } catch (err) {
        chimeVoices = [];
      }
    }

    function unlockAudioOnce() {
      window.removeEventListener('pointerdown', unlockAudioOnce);
      window.removeEventListener('keydown', unlockAudioOnce);
      try {
        if (audioCtx) audioCtx.resume().then(() => {
          audioReady = true;
          updateSoundToggleUI();
        });
      } catch (err) {}
    }

    function ringChimeGain(gainParam, peak, now) {
      gainParam.cancelScheduledValues(now);
      gainParam.setValueAtTime(gainParam.value, now);
      gainParam.linearRampToValueAtTime(peak, now + CHIME_ATTACK);
      gainParam.linearRampToValueAtTime(0, now + CHIME_ATTACK + CHIME_DECAY);
    }

    function triggerGlassChime(strength) {
      if (!soundOutputEnabled) return;
      if (!audioReady || !chimeVoices.length) return;
      try {
        const voice = chimeVoices[nextChimeVoice];
        nextChimeVoice = (nextChimeVoice + 1) % chimeVoices.length;
        const freqPos = readControl(frequencyInput, 15) / 100;
        const baseFreq = CHIME_FREQ_AT_0 * Math.pow(CHIME_FREQ_AT_100 / CHIME_FREQ_AT_0, freqPos);
        const ratio = random(CHIME_PARTIAL_MIN, CHIME_PARTIAL_MAX);
        const now = audioCtx.currentTime;
        voice.tone.frequency.setValueAtTime(baseFreq, now);
        voice.partial.frequency.setValueAtTime(baseFreq * ratio, now);
        const thirdFreq = baseFreq * CHIME_THIRD_RATIO;
        voice.third.frequency.setValueAtTime(thirdFreq, now);
        voice.fourth.frequency.setValueAtTime(thirdFreq * CHIME_FOURTH_RATIO, now);
        voice.fifth.frequency.setValueAtTime(baseFreq * CHIME_FIFTH_RATIO, now);
        voice.octave.frequency.setValueAtTime(baseFreq * CHIME_OCTAVE_RATIO, now);
        const loud = constrain(strength / 2.2, 0.14, 1);
        const volume = readControl(volumeInput, 50) / 100;
        const peak = CHIME_PEAK * loud * volume;
        ringChimeGain(voice.toneGain.gain, peak, now);
        ringChimeGain(voice.partialGain.gain, peak * CHIME_PARTIAL_GAIN, now);
        ringChimeGain(voice.thirdGain.gain, peak * CHIME_THIRD_GAIN, now);
        ringChimeGain(voice.fourthGain.gain, peak * CHIME_FOURTH_GAIN, now);
        ringChimeGain(voice.fifthGain.gain, peak * CHIME_FIFTH_GAIN, now);
        ringChimeGain(voice.octaveGain.gain, peak * CHIME_OCTAVE_GAIN, now);
        if (delayWet && delayFeedback) {
          const delayAmount = readControl(delayInput, 0) / 100;
          delayWet.gain.setValueAtTime(delayAmount * 0.5, now);
          delayFeedback.gain.setValueAtTime(delayAmount > 0 ? 0.2 + delayAmount * 0.25 : 0, now);
        }
      } catch (err) {}
    }

    function buildCloud() {
      pieces = [];
      const cx = width / 2;
      const cy = height / 2;
      const points = [];

      for (let i = 0; i < CLOUD_POINT_COUNT; i++) {
        const angle = random(TWO_PI);
        const r = Math.sqrt(random()) * CLOUD_RADIUS;
        const dx = Math.cos(angle) * r;
        const dy = Math.sin(angle) * r;
        const distNorm = r / CLOUD_RADIUS;
        const glowColor = sampleGlowColor(distNorm);
        const glowBucket = Math.round(distNorm * (GLOW_BUCKETS - 1));

        points.push({
          id: nextPointId++,
          x: dx,
          y: dy,
          px: cx + dx,
          py: cy + dy,
          vx: 0,
          vy: 0,
          phase: random(TWO_PI),
          densityRank: random(),
          linkRank: random(),
          r: 230,
          g: 232,
          b: 238,
          tigleR: red(glowColor),
          tigleG: green(glowColor),
          tigleB: blue2(glowColor),
          glowBucket: glowBucket,
          a: 0,
          reveal: distNorm * 0.72,
          tone: random(),
          flashUntil: 0
        });
      }

      pieces.push({ cx, cy, points });
    }

    function buildIntroLayers() {
      try {
        if (introGlyphReady && introGlyphImg) {
          introGlyphLayer = introGlyphImg;
        }
      } catch (err) {
        introGlyphLayer = null;
      }
    }

    function draw() {
      debugBeginFrame();
      updatePerfScaling();
      const bg = color(PALETTE.background);
      const trail = readControl(trailInput, 10) / 100;
      bg.setAlpha(255);
      noStroke();
      fill(bg);
      rect(0, 0, width, height);
      debugMark('other');

      updateStars();
      drawStars();
      debugMark('stars');

      const elapsed = millis() - startedAt;
      const progress = drawIntro(elapsed);
      debugMark('intro');

      const density = 0.1 + 0.9 * (readControl(densityInput, 60) / 100);
      const speedMul = readControl(speedInput, 100) / 100;
      const vortex = readControl(vortexInput, 100) / 100;
      const sphere = readControl(sphereInput, 0) / 100;
      sphereRadiusPx = lerp(SPHERE_RADIUS_MIN, SPHERE_RADIUS_MAX, sphere);
      const distance = readControl(distanceInput, 100) / 100;
      const cohesion = readControl(cohesionInput, 0) / 100;
      const screenSize = Math.sqrt(width * width + height * height);
      const maxSpread = lerp(screenSize * DIST_MIN_SHARE, screenSize * DIST_MAX_SHARE, distance);
      const linkShare = (readControl(linksInput, 0) / 100) * LINK_MAX_SHARE;
      const glow = readControl(glowInput, 45) / 100;

      cloudMixAmount = readControl(hsbMixInput, 0) / 100;
      if (lastMixHue !== cloudHue || lastMixSat !== cloudSaturation) {
        colorMode(HSB, 360, 100, 100, 255);
        const hsbMixColor = color(cloudHue, cloudSaturation, 100);
        colorMode(RGB, 255, 255, 255, 255);
        cloudMixR = red(hsbMixColor);
        cloudMixG = green(hsbMixColor);
        cloudMixB = blue2(hsbMixColor);
        lastMixHue = cloudHue;
        lastMixSat = cloudSaturation;
      }

      // HSB-спрайт свечения нужен только когда микс заметный; перестраивается
      // только при смене оттенка/насыщенности.
      if (cloudMixAmount > 0.3 &&
          (hsbGlowSpriteHue !== cloudHue || hsbGlowSpriteSat !== cloudSaturation)) {
        buildHsbGlowSprite();
      }
      debugMark('other');

      updatePresence(readControl(presenceInput, 0) / 100);
      debugMark('mic');
      updateSun();
      drawSun();
      updatePlanet();
      drawPlanet();
      updatePlanet2();
      drawPlanet2();
      debugMark('planets');
      updateField(elapsed);
      debugMark('field');
      activePoints.length = 0;

      for (const piece of pieces) {
        updateWordPoints(piece, progress, elapsed, density, speedMul, vortex, sphere, maxSpread, cohesion);
      }
      debugMark('physics');

      resolveCollisions();
      debugMark('collide');
      if (linkShare > 0) drawLinks(linkShare);
      debugMark('links');
      drawDots(glow, trail);
      debugMark('dots');
      drawPresenceBadge();
      debugMark('mic');
      updateControlValueDisplays();
      drawPerfHud();
      debugMark('other');
      debugEndFrame();
    }

    function drawIntro(elapsed) {
      const t = constrain(elapsed / INTRO_MS, 0, 1);
      const eased = t * t * (3 - 2 * t);
      const wordT = constrain(t * WORD_DISSOLVE_SPEEDUP, 0, 1);
      const wordEased = wordT * wordT * (3 - 2 * wordT);
      const wordAlpha = 255 * INTRO_START_ALPHA * (1 - wordEased);

      const cx = width / 2;
      const cy = height / 2;
      const glyphSize = INTRO_GLOW_BASE * 2;

      const glowMaxRadius = Math.sqrt(width * width + height * height) / 2 + INTRO_GLOW_BASE;
      const glowRadius = lerp(INTRO_GLOW_BASE, glowMaxRadius, eased);
      const glowAlphaMul = INTRO_START_ALPHA * (1 - eased);

      if (glowAlphaMul > 0.002) {
        const context = drawingContext;
        const halo = context.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
        const stops = GLOW_COLORS.length - 1;
        for (let i = 0; i < GLOW_COLORS.length; i++) {
          const c = color(GLOW_COLORS[i]);
          const stopAlpha = i === GLOW_COLORS.length - 1 ? 0 : glowAlphaMul;
          halo.addColorStop(i / stops, `rgba(${red(c)}, ${green(c)}, ${blue2(c)}, ${stopAlpha})`);
        }
        noStroke();
        context.fillStyle = halo;
        context.beginPath();
        context.arc(cx, cy, glowRadius, 0, TWO_PI);
        context.fill();
      }

      if (wordAlpha > 0.5 && introGlyphLayer) {
        push();
        imageMode(CENTER);
        tint(255, wordAlpha);
        image(introGlyphLayer, cx, cy, glyphSize, glyphSize);
        pop();
      }

      return eased;
    }

    function readControl(input, fallback) {
      const value = input ? Number(input.value) : fallback;
      return Number.isFinite(value) ? value : fallback;
    }

    // Значения ползунков пишутся в DOM только когда реально изменились —
    // в покое функция не трогает страницу вовсе.
    function updateControlValueDisplays() {
      controlRangeInputs.forEach(input => {
        const span = input.nextElementSibling;
        if (!span || !span.classList.contains('control-value')) return;
        const v = Math.round(Number(input.value));
        if (lastControlValues[input.id] === v) return;
        lastControlValues[input.id] = v;
        const suffix = span.dataset.suffix || '';
        span.textContent = v + suffix;
      });
    }

    function updatePresence(sensitivity) {
      const now = millis();
      const dt = presenceAt ? Math.min(0.1, (now - presenceAt) / 1000) : 1 / 30;
      presenceAt = now;
      if (!presenceEnabled) {
        stopMic();
        soundLevel = 0;
        vibrationEnv = 0;
        for (const z in zones) zones[z] = 0;
        updatePresenceToggleUI();
        return;
      }
      ensureMic();
      let energy = 0;
      if (micReady && analyser && micData) {
        analyser.getByteTimeDomainData(micData);
        let sumSquares = 0;
        for (let i = 0; i < micData.length; i++) {
          const v = (micData[i] - 128) / 128;
          sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / micData.length);
        energy = constrain(rms * 7, 0, 1);
      }
      soundLevel = lerp(soundLevel, energy, 0.35);
      zones.head = lerp(zones.head, soundLevel, 0.45);
      zones.torso = lerp(zones.torso, soundLevel, 0.3);
      zones.left = lerp(zones.left, soundLevel, 0.22);
      zones.right = lerp(zones.right, soundLevel, 0.18);
      const boost = 1 + sensitivity * 3;
      const drive = constrain(soundLevel * boost, 0, 1);
      // Затухание вибрации привязано ко времени, а не к кадру: на просадке
      // fps облако затухает с той же скоростью, что и на стабильных 30.
      const decay = Math.pow(0.72, dt * 30);
      if (drive > vibrationEnv) vibrationEnv = drive;
      else vibrationEnv *= decay;
      updatePresenceToggleUI();
    }

    function updateSun() {
      const t = readControl(sunAttractionInput, 0) / 100;
      sunMassRatio = t * (SUN_MASS_KG / MOON_MASS_KG);
      sunRadiusPx = lerp(SUN_RADIUS_MIN, SUN_RADIUS_MAX, t);
    }

    function drawSun() {
      const context = drawingContext;
      const sx = width / 2;
      const sy = height / 2;
      const c = color(PALETTE.orange);
      const r = red(c);
      const g = green(c);
      const b = blue2(c);
      const haloRadius = sunRadiusPx * 6;
      const halo = context.createRadialGradient(sx, sy, 0, sx, sy, haloRadius);
      halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.75)`);
      halo.addColorStop(0.25, `rgba(${r}, ${g}, ${b}, 0.32)`);
      halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      noStroke();
      context.fillStyle = halo;
      context.beginPath();
      context.arc(sx, sy, haloRadius, 0, TWO_PI);
      context.fill();
      fill(PALETTE.light);
      circle(sx, sy, sunRadiusPx * 2);
    }

    function updatePlanet() {
      const now = millis();
      const dt = planetAt ? Math.min(0.1, (now - planetAt) / 1000) : 1 / 30;
      planetAt = now;
      const massT = readControl(planetMassInput, 0) / 100;
      const speedT = readControl(planetSpeedInput, 0) / 100;
      const distT = readControl(planetDistanceInput, 0) / 100;
      planetMassRatio = Math.pow(SATURN_MASS_KG / MOON_MASS_KG, massT) * 5;
      planetDistanceRatio = lerp(1, 100, distT);
      const speedMultiplier = lerp(1, 100, speedT);
      const angularSpeed = (TWO_PI / MOON_ORBIT_PERIOD_S) * speedMultiplier;
      planetAngle += angularSpeed * dt;
      const rx = lerp(PLANET_ORBIT_RX, PLANET_ORBIT_RX * PLANET_ORBIT_GROWTH, distT);
      const ry = lerp(PLANET_ORBIT_RY, PLANET_ORBIT_RY * PLANET_ORBIT_GROWTH, distT);
      planetX = width / 2 + Math.cos(planetAngle) * rx;
      planetY = height / 2 + Math.sin(planetAngle) * ry;
      planetRadiusPx = lerp(PLANET_RADIUS_MIN, PLANET_RADIUS_MAX, Math.sqrt(massT));
      planetDepthZ = Math.sin(planetAngle) * PLANET_DEPTH_TILT;
      planetScale = DEPTH_FOCAL / (DEPTH_FOCAL + planetDepthZ);
    }

    function drawPlanet() {
      const context = drawingContext;
      const c = color(PALETTE.blue);
      const r = red(c);
      const g = green(c);
      const b = blue2(c);
      const sx = width / 2 + (planetX - width / 2) * planetScale;
      const sy = height / 2 + (planetY - height / 2) * planetScale;
      const radiusPx = planetRadiusPx * planetScale;
      const haloRadius = radiusPx * 3.4;
      const halo = context.createRadialGradient(sx, sy, 0, sx, sy, haloRadius);
      halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.55)`);
      halo.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, 0.22)`);
      halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      noStroke();
      context.fillStyle = halo;
      context.beginPath();
      context.arc(sx, sy, haloRadius, 0, TWO_PI);
      context.fill();
      fill(c);
      circle(sx, sy, radiusPx * 2);
    }

    function updatePlanet2() {
      const now = millis();
      const dt = planet2At ? Math.min(0.1, (now - planet2At) / 1000) : 1 / 30;
      planet2At = now;
      const massT = readControl(planet2MassInput, 0) / 100;
      const speedT = readControl(planet2SpeedInput, 0) / 100;
      const distT = readControl(planet2DistanceInput, 0) / 100;
      planet2MassRatio = Math.pow(SATURN_MASS_KG / MOON_MASS_KG, massT) * 5;
      planet2DistanceRatio = lerp(1, 100, distT);
      const speedMultiplier = lerp(1, 100, speedT);
      const angularSpeed = (TWO_PI / MOON_ORBIT_PERIOD_S) * speedMultiplier;
      planet2Angle += angularSpeed * dt;
      const rx = lerp(PLANET2_ORBIT_RX, PLANET2_ORBIT_RX * PLANET_ORBIT_GROWTH, distT);
      const ry = lerp(PLANET2_ORBIT_RY, PLANET2_ORBIT_RY * PLANET_ORBIT_GROWTH, distT);
      planet2X = width / 2 + Math.cos(planet2Angle) * rx;
      planet2Y = height / 2 + Math.sin(planet2Angle) * ry;
      planet2RadiusPx = lerp(PLANET_RADIUS_MIN, PLANET_RADIUS_MAX, Math.sqrt(massT));
      planet2DepthZ = Math.sin(planet2Angle + Math.PI / 3) * PLANET2_DEPTH_TILT;
      planet2Scale = DEPTH_FOCAL / (DEPTH_FOCAL + planet2DepthZ);
    }

    function drawPlanet2() {
      const context = drawingContext;
      const c = color('#ff4438');
      const r = red(c);
      const g = green(c);
      const b = blue2(c);
      const sx = width / 2 + (planet2X - width / 2) * planet2Scale;
      const sy = height / 2 + (planet2Y - height / 2) * planet2Scale;
      const radiusPx = planet2RadiusPx * planet2Scale;
      const haloRadius = radiusPx * 3.4;
      const halo = context.createRadialGradient(sx, sy, 0, sx, sy, haloRadius);
      halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.55)`);
      halo.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, 0.22)`);
      halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      noStroke();
      context.fillStyle = halo;
      context.beginPath();
      context.arc(sx, sy, haloRadius, 0, TWO_PI);
      context.fill();
      fill(c);
      circle(sx, sy, radiusPx * 2);
    }

    function ensureMic() {
      if (micStream || micRequesting) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      micRequesting = true;
      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
          micRequesting = false;
          if (!presenceEnabled) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = Ctx ? new Ctx() : null;
          }
          if (!audioCtx) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          micStream = stream;
          micSource = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          micData = new Uint8Array(analyser.fftSize);
          micSource.connect(analyser);
          micReady = true;
        })
        .catch(() => {
          micRequesting = false;
          micReady = false;
        });
    }

    function stopMic() {
      if (micStream) micStream.getTracks().forEach(track => track.stop());
      if (micSource) micSource.disconnect();
      if (analyser) analyser.disconnect();
      micStream = null;
      micSource = null;
      analyser = null;
      micData = null;
      micReady = false;
    }

    function buildField() {
      const cols = Math.ceil(width / FIELD_CELL) + 1;
      const rows = Math.ceil(height / FIELD_CELL) + 1;
      field = {
        cols,
        rows,
        phi: new Float32Array(cols * rows),
        vx: new Float32Array(cols * rows),
        vy: new Float32Array(cols * rows),
        region: new Float32Array(cols * rows)
      };
    }

    function buildStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        const star = {
          x: random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD),
          y: random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD),
          z: random(STAR_NEAR_Z, STAR_FAR_Z),
          speedMul: random(STAR_SPEED_MUL_MIN, STAR_SPEED_MUL_MAX),
          prevSx: 0,
          prevSy: 0
        };
        const scale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
        star.prevSx = width / 2 + star.x * scale;
        star.prevSy = height / 2 + star.y * scale;
        stars.push(star);
      }
    }

    function updateStars() {
      const now = millis();
      const dt = starsAt ? Math.min(0.1, (now - starsAt) / 1000) : 1 / 30;
      starsAt = now;
      const starSpeedT = readControl(starSpeedInput, 0) / 100;
      const forwardMul = lerp(1, 2, readControl(starForwardInput, 0) / 100);
      const flightSpeed = STAR_FLIGHT_SPEED * lerp(1, 10, starSpeedT) * forwardMul;
      const spinSpeed = STAR_SPIN_MAX_SPEED * (readControl(starSpinInput, 0) / 100);
      const cosOld = Math.cos(starSpinAngle);
      const sinOld = Math.sin(starSpinAngle);
      starSpinAngle += spinSpeed * dt;
      const cosNew = Math.cos(starSpinAngle);
      const sinNew = Math.sin(starSpinAngle);
      for (const star of stars) {
        const scale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
        const rx = star.x * cosOld - star.y * sinOld;
        const ry = star.x * sinOld + star.y * cosOld;
        star.prevSx = width / 2 + rx * scale;
        star.prevSy = height / 2 + ry * scale;
        star.z -= flightSpeed * star.speedMul * dt;
        if (star.z <= STAR_NEAR_Z) {
          star.x = random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD);
          star.y = random(-STAR_FIELD_SPREAD, STAR_FIELD_SPREAD);
          star.z = random(STAR_FAR_Z * 0.75, STAR_FAR_Z);
          star.speedMul = random(STAR_SPEED_MUL_MIN, STAR_SPEED_MUL_MAX);
          const freshScale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
          const frx = star.x * cosNew - star.y * sinNew;
          const fry = star.x * sinNew + star.y * cosNew;
          star.prevSx = width / 2 + frx * freshScale;
          star.prevSy = height / 2 + fry * freshScale;
        }
      }
    }

    function drawStarSegment(context, x1, y1, x2, y2, r, g, b, alpha, lineWidth) {
      const gradient = context.createLinearGradient(x1, y1, x2, y2);
      gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0)`);
      gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${alpha})`);
      context.strokeStyle = gradient;
      context.lineWidth = lineWidth;
      context.lineCap = 'round';
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    }

    const STAR_TAIL_MAX_PX = 400;
    const STAR_SIMPLIFY_ABOVE = 0.45;
    const STAR_THIN_ABOVE = 0.7;
    const STAR_CULL_MARGIN = 50;
    
    // Цвета звёзд считаются обычной арифметикой (раньше на каждую звезду
    // создавалось ~8 объектов p5.Color). Тени и блики вдоль хвоста рисуются
    // только у звёзд толще пикселя - у тонких они всё равно не видны.
    // Звёзды целиком за краем холста пропускаются.
    const STAR_DETAIL_MIN_WIDTH = 1;

    function drawStars() {
      if (starEnabledInput && !starEnabledInput.checked) return;
      const context = drawingContext;
      const base = color(PALETTE.muted);
      const bright = color(PALETTE.light);
      const bg = color(PALETTE.background);
      const baseR = red(base), baseG = green(base), baseB = blue2(base);
      const brightR = red(bright), brightG = green(bright), brightB = blue2(bright);
      const bgR = red(bg), bgG = green(bg), bgB = blue2(bg);
      const contrastMul = lerp(1, 2, readControl(starContrastInput, 0) / 100);
      const dimAlpha = lerp(36, 255, readControl(starBrightnessInput, 0) / 100);
      const cosA = Math.cos(starSpinAngle);
      const sinA = Math.sin(starSpinAngle);
      const tailShare = readControl(starSpeedInput, 0) / 100;
      const cx = width / 2;
      const cy = height / 2;
      const minX = -STAR_CULL_MARGIN;
      const maxX = width + STAR_CULL_MARGIN;
      const minY = -STAR_CULL_MARGIN;
      const maxY = height + STAR_CULL_MARGIN;
      for (const star of stars) {
        const scale = DEPTH_FOCAL / (DEPTH_FOCAL + star.z);
        const rx = star.x * cosA - star.y * sinA;
        const ry = star.x * sinA + star.y * cosA;
        const sx = cx + rx * scale;
        const sy = cy + ry * scale;
        const stretchedTailX = sx + (star.prevSx - sx) * STAR_TAIL_STRETCH;
        const stretchedTailY = sy + (star.prevSy - sy) * STAR_TAIL_STRETCH;
        const tailX = stretchedTailX + (cx - stretchedTailX) * tailShare;
        const tailY = stretchedTailY + (cy - stretchedTailY) * tailShare;
        if ((sx < minX && tailX < minX) || (sx > maxX && tailX > maxX) ||
            (sy < minY && tailY < minY) || (sy > maxY && tailY > maxY)) {
          continue;
        }
        const depthT = constrain(1 - star.z / STAR_FAR_Z, 0, 1);
        const r = baseR + (brightR - baseR) * depthT;
        const g = baseG + (brightG - baseG) * depthT;
        const b = baseB + (brightB - baseB) * depthT;
        const alpha = Math.min(255, dimAlpha + depthT * 190 * contrastMul);
        const lineWidth = (0.6 + depthT * 1.4 * contrastMul) * scale * 1.5;
        if (lineWidth >= STAR_DETAIL_MIN_WIDTH) {
          const dx = sx - tailX;
          const dy = sy - tailY;
          const segLen = Math.sqrt(dx * dx + dy * dy) || 1;
          const nx = -dy / segLen;
          const ny = dx / segLen;
          const shadeOffset = lineWidth * 0.55;
          drawStarSegment(
            context,
            tailX - nx * shadeOffset, tailY - ny * shadeOffset,
            sx - nx * shadeOffset, sy - ny * shadeOffset,
            r + (bgR - r) * 0.6, g + (bgG - g) * 0.6, b + (bgB - b) * 0.6,
            (alpha / 255) * 0.7, lineWidth * 0.75
          );
          drawStarSegment(context, tailX, tailY, sx, sy, r, g, b, alpha / 255, lineWidth);
          drawStarSegment(
            context,
            tailX + nx * shadeOffset, tailY + ny * shadeOffset,
            sx + nx * shadeOffset, sy + ny * shadeOffset,
            r + (brightR - r) * 0.65, g + (brightG - g) * 0.65, b + (brightB - b) * 0.65,
            (alpha / 255) * 0.6, lineWidth * 0.5
          );
        } else {
          drawStarSegment(context, tailX, tailY, sx, sy, r, g, b, alpha / 255, lineWidth);
        }
      }
      noStroke();
    }

    // Поле шума пересчитывается через кадр — оно всё равно меняется медленно,
    // а 1250 вызовов noise() за кадр это заметная доля нагрузки.
    function updateField(elapsed) {
      if (fieldFrame % 2 !== 0) {
        fieldFrame++;
        return;
      }
      fieldFrame++;
      const t = elapsed * 0.00005;
      const { cols, rows, phi, vx, vy, region } = field;
      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          phi[i + j * cols] = noise(i * FIELD_WAVE, j * FIELD_WAVE, t);
          region[i + j * cols] = noise(i * FIELD_WAVE * 0.6 + 300, j * FIELD_WAVE * 0.6 + 300, t * 0.6);
        }
      }
      let regionMin = 1;
      let regionMax = 0;
      for (let k = 0; k < cols * rows; k++) {
        if (region[k] < regionMin) regionMin = region[k];
        if (region[k] > regionMax) regionMax = region[k];
      }
      const regionSpan = Math.max(regionMax - regionMin, 0.0001);
      for (let k = 0; k < cols * rows; k++) {
        region[k] = (region[k] - regionMin) / regionSpan;
      }
      let maxMag = 0.0001;
      for (let j = 0; j < rows; j++) {
        const jm = Math.max(j - 1, 0);
        const jp = Math.min(j + 1, rows - 1);
        for (let i = 0; i < cols; i++) {
          const im = Math.max(i - 1, 0);
          const ip = Math.min(i + 1, cols - 1);
          const dx = phi[ip + j * cols] - phi[im + j * cols];
          const dy = phi[i + jp * cols] - phi[i + jm * cols];
          const k = i + j * cols;
          vx[k] = dy;
          vy[k] = -dx;
          const mag = Math.sqrt(dy * dy + dx * dx);
          if (mag > maxMag) maxMag = mag;
        }
      }
      const targetGain = MAX_SPEED / maxMag;
      fieldGain = fieldGain === 0 ? targetGain : lerp(fieldGain, targetGain, 0.06);
    }

    function sampleField(x, y, out) {
      const { cols, rows, vx, vy, region } = field;
      const fx = constrain(x / FIELD_CELL, 0, cols - 1.001);
      const fy = constrain(y / FIELD_CELL, 0, rows - 1.001);
      const i = Math.floor(fx);
      const j = Math.floor(fy);
      const u = fx - i;
      const v = fy - j;
      const k00 = i + j * cols;
      const k10 = k00 + 1;
      const k01 = k00 + cols;
      const k11 = k01 + 1;
      const w00 = (1 - u) * (1 - v);
      const w10 = u * (1 - v);
      const w01 = (1 - u) * v;
      const w11 = u * v;
      out.vx = (vx[k00] * w00 + vx[k10] * w10 + vx[k01] * w01 + vx[k11] * w11) * fieldGain;
      out.vy = (vy[k00] * w00 + vy[k10] * w10 + vy[k01] * w01 + vy[k11] * w11) * fieldGain;
      out.region = region[k00] * w00 + region[k10] * w10 + region[k01] * w01 + region[k11] * w11;
    }

    const fieldSample = { vx: 0, vy: 0, region: 0 };
    const blue2 = c => blue(c);

    function updateWordPoints(piece, progress, elapsed, density, speedMul, vortex, sphere, maxSpread, cohesion) {
      if (progress <= 0) return;
      const breathTime = elapsed * 0.00115;
      const flow = progress * progress * (3 - 2 * progress);

      // Общие множители сил притяжения вынесены за цикл по точкам —
      // раньше эти три деления считались на каждую из 5200 точек.
      const planetPullK  = (PLANET_PULL_BASE * planetMassRatio)  /
                            (planetDistanceRatio  * planetDistanceRatio);
      const planet2PullK = (PLANET_PULL_BASE * planet2MassRatio) /
                            (planet2DistanceRatio * planet2DistanceRatio);
      const sunPullK     = SUN_PULL_BASE * sunMassRatio;
      const hasSun       = sunMassRatio > 0;

      liveScratch.length = 0;
      for (const point of piece.points) {
        if (point.densityRank > density) continue;

        const local = constrain((progress - point.reveal * 0.42) / 0.58, 0, 1);
        if (local <= 0) continue;

        if (flow > 0) {
          sampleField(point.px, point.py, fieldSample);
          let targetVx = fieldSample.vx;
          let targetVy = fieldSample.vy;
          if (vortex > 0) {
            if (point.orbitPhase === undefined) point.orbitPhase = point.phase;
            const radiusX = 440 + (point.tone - 0.5) * 90;
            const radiusY = 220 + (point.densityRank - 0.5) * 60;
            const theta = point.orbitPhase;
            const tangentX = radiusX * Math.cos(theta);
            const tangentY = 2 * radiusY * Math.cos(2 * theta);
            const tangentLen = Math.sqrt(tangentX * tangentX + tangentY * tangentY);
            const angularSpeed = 0.9 / Math.max(1, tangentLen);
            const targetX = width / 2 + radiusX * Math.sin(theta);
            const targetY = height / 2 + radiusY * Math.sin(2 * theta);
            const orbitVx = tangentX * angularSpeed + (targetX - point.px) * 0.018;
            const orbitVy = tangentY * angularSpeed + (targetY - point.py) * 0.018;
            targetVx = lerp(targetVx, orbitVx, vortex);
            targetVy = lerp(targetVy, orbitVy, vortex);
            point.orbitPhase += angularSpeed * flow * speedMul * vortex;
          }
          if (sphere > 0) {
            if (point.sphereTheta === undefined) point.sphereTheta = point.phase;
            if (point.spherePhi === undefined) point.spherePhi = point.tone * Math.PI * 2;
            if (point.spherePhiRate === undefined) point.spherePhiRate = random(SPHERE_PHI_RATE_MIN, SPHERE_PHI_RATE_MAX);
            const theta = point.sphereTheta;
            const phi = point.spherePhi;
            const sinPhi = Math.sin(phi);
            const sphereX = sphereRadiusPx * sinPhi * Math.cos(theta);
            const sphereY = sphereRadiusPx * sinPhi * Math.sin(theta);
            const tangentSphereX = -sphereRadiusPx * sinPhi * Math.sin(theta);
            const tangentSphereY = sphereRadiusPx * sinPhi * Math.cos(theta);
            const targetSphereX = width / 2 + sphereX;
            const targetSphereY = height / 2 + sphereY;
            const sphereOrbitVx = tangentSphereX * SPHERE_ANGULAR_SPEED + (targetSphereX - point.px) * 0.02;
            const sphereOrbitVy = tangentSphereY * SPHERE_ANGULAR_SPEED + (targetSphereY - point.py) * 0.02;
            targetVx = lerp(targetVx, sphereOrbitVx, sphere);
            targetVy = lerp(targetVy, sphereOrbitVy, sphere);
            point.sphereTheta += SPHERE_ANGULAR_SPEED * flow * speedMul * sphere;
            point.spherePhi += SPHERE_PHI_SPEED * point.spherePhiRate * flow * speedMul * sphere;
            point.sphereDepth = sphereRadiusPx * Math.cos(phi);
            point.sphereRadiusXY = sphereRadiusPx * sinPhi;
          }
          if (cohesion > 0) {
            const dxHome = piece.cx - point.px;
            const dyHome = piece.cy - point.py;
            const distHome = Math.sqrt(dxHome * dxHome + dyHome * dyHome);
            if (distHome > 1) {
              const pullMag = Math.min(distHome * COHESION_RATE, COHESION_MAX_PULL) * cohesion;
              targetVx += (dxHome / distHome) * pullMag;
              targetVy += (dyHome / distHome) * pullMag;
            }
          }
          point.vx = lerp(point.vx, targetVx * flow * speedMul, 0.08);
          point.vy = lerp(point.vy, targetVy * flow * speedMul, 0.08);
          if (vortex > 0 || sphere > 0) {
            const vlen = Math.sqrt(point.vx * point.vx + point.vy * point.vy);
            const limit = Math.min(1, 2.7 / Math.max(0.001, vlen));
            point.vx *= limit;
            point.vy *= limit;
          }
          point.px += point.vx;
          point.py += point.vy;
          if (vibrationEnv > 0.02) {
            const amp = vibrationEnv * VIBRATION_AMP;
            const t = elapsed * VIBRATION_SPEED + point.phase;
            point.px += Math.sin(t) * amp;
            point.py += Math.cos(t * 1.37 + point.phase) * amp;
          }
          {
            const pdx = planetX - point.px;
            const pdy = planetY - point.py;
            const pDistSq = pdx * pdx + pdy * pdy + PLANET_SOFTEN * PLANET_SOFTEN;
            const pDist = Math.sqrt(pDistSq);
            const pullMag = Math.min(planetPullK / pDistSq, PLANET_PULL_MAX);
            point.px += (pdx / pDist) * pullMag;
            point.py += (pdy / pDist) * pullMag;
          }
          {
            const p2dx = planet2X - point.px;
            const p2dy = planet2Y - point.py;
            const p2DistSq = p2dx * p2dx + p2dy * p2dy + PLANET_SOFTEN * PLANET_SOFTEN;
            const p2Dist = Math.sqrt(p2DistSq);
            const p2PullMag = Math.min(planet2PullK / p2DistSq, PLANET_PULL_MAX);
            point.px += (p2dx / p2Dist) * p2PullMag;
            point.py += (p2dy / p2Dist) * p2PullMag;
          }
          if (hasSun) {
            const sdx = width / 2 - point.px;
            const sdy = height / 2 - point.py;
            const sDistSq = sdx * sdx + sdy * sdy + SUN_SOFTEN * SUN_SOFTEN;
            const sDist = Math.sqrt(sDistSq);
            const sPullMag = Math.min(sunPullK / sDistSq, SUN_PULL_MAX);
            point.px += (sdx / sDist) * sPullMag;
            point.py += (sdy / sDist) * sPullMag;
          }
          if (point.px < -4) point.px += width + 8;
          if (point.px > width + 4) point.px -= width + 8;
          if (point.py < -4) point.py += height + 8;
          if (point.py > height + 4) point.py -= height + 8;

          if (sphere > 0 && point.sphereRadiusXY !== undefined) {
            const sLockDx = point.px - width / 2;
            const sLockDy = point.py - height / 2;
            const sLockDist = Math.sqrt(sLockDx * sLockDx + sLockDy * sLockDy) || 1;
            const sLockedDist = lerp(sLockDist, point.sphereRadiusXY, sphere);
            point.px = width / 2 + (sLockDx / sLockDist) * sLockedDist;
            point.py = height / 2 + (sLockDy / sLockDist) * sLockedDist;
          }

          point._region = fieldSample.region;
        } else {
          point._region = 0.5;
        }

        liveScratch.push(point);
      }

      if (flow > 0 && liveScratch.length > 1) {
        let centerX = 0;
        let centerY = 0;
        for (const point of liveScratch) {
          centerX += point.px;
          centerY += point.py;
        }
        centerX /= liveScratch.length;
        centerY /= liveScratch.length;
