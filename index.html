<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genesis - Birth of the Universe v.2.0</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.13/p5.min.js" defer></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e0f12;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #8a8f99;
      font: 13px/1.2 'PT Mono', monospace;
    }
    #stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      max-width: 100%;
      aspect-ratio: 16 / 9;
    }
    /* WebGL-слой с точками лежит точно поверх p5-канвы и не ловит мышь. */
    #pointsLayer {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    #controlsToggle {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 21;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14161b;
      border: 1px solid #2c2f38;
      border-radius: 6px;
      color: #e6e8ee;
      font: 16px/1 'PT Mono', monospace;
      cursor: pointer;
    }
    #controlsToggle:hover {
      border-color: #ff7a50;
      color: #ff7a50;
    }
    #controls {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      height: 100%;
      width: min(84vw, 300px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 22px;
      padding: 60px 16px 16px;
      background: rgba(14, 15, 18, 0.2);
      border-right: 1px solid #22242b;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    #controls.open {
      transform: translateX(0);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .group-title {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5a5f69;
    }
    .group-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }
    .group-body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }
    .chaos-frame {
      margin-top: auto;
      padding: 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chaos-btn {
      background: linear-gradient(180deg, #ff9a3d, #ff7a10);
      border: 1px solid #a8480a;
      border-radius: 6px;
      color: #2a1400;
      font: 700 13px/1.2 'PT Mono', monospace;
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 3px 0 #9a3f08, 0 5px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transform: translateY(0);
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease, color 0.15s ease;
    }
    .chaos-btn:hover {
      background: linear-gradient(180deg, #ffe066, #ffcc00);
      border-color: #cc9900;
      color: #2a2000;
    }
    .chaos-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #9a3f08, inset 0 2px 5px rgba(0, 0, 0, 0.4);
    }
    .mic-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #14161b;
      border: 1px solid #2c2f38;
      border-radius: 6px;
      color: #8a8f99;
      font: 13px/1.2 'PT Mono', monospace;
      padding: 9px 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .mic-toggle:hover {
      border-color: #ff7a50;
      color: #e6e8ee;
    }
    .mic-toggle-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #3a3d45;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .mic-toggle.live .mic-toggle-dot {
      background: #ff7a50;
      box-shadow: 0 0 8px 2px rgba(255, 122, 80, 0.65);
    }
    .midi-hint {
      font-size: 11px;
      line-height: 1.4;
      color: #5a5f69;
    }
    body.midi-learning #controls label:hover,
    body.midi-learning #chaosBtn:hover,
    body.midi-learning #presenceToggle:hover,
    body.midi-learning #soundToggle:hover,
    body.midi-learning #controlsToggle:hover {
      outline: 2px dashed #ff7a50;
      outline-offset: 2px;
      cursor: crosshair;
    }
    .midi-armed {
      outline: 2px solid #ff7a50;
      outline-offset: 2px;
      animation: midiPulse 0.9s ease-in-out infinite;
    }
    @keyframes midiPulse {
      0%, 100% { outline-color: #ff7a50; }
      50% { outline-color: #ffe066; }
    }
    .midi-live {
      background: rgba(255, 122, 80, 0.18);
      border-radius: 4px;
      transition: background 0.18s ease;
    }
    #controls label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    #controls input[type="range"] {
      flex: 1 1 120px;
      min-width: 90px;
      width: auto;
      accent-color: #ff7a50;
    }
    #controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff7a50;
      cursor: pointer;
    }
    .control-value {
      display: inline-block;
      min-width: 2.6em;
      color: #ff7a50;
      font-variant-numeric: tabular-nums;
    }
    #controls .hsb-control {
      gap: 9px;
    }
    .hsb-wheel {
      position: relative;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      cursor: crosshair;
      touch-action: none;
      background:
        radial-gradient(circle, #e6e8ee 0 0, transparent 70%),
        conic-gradient(#ff5050, #ff7a50, #ffe650, #58e878, #55dfff, #5aa9ff, #bd72ff, #ff5aa8, #ff5050);
    }
    .hsb-wheel::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, #e6e8ee 0, transparent 10%, transparent 100%);
      pointer-events: none;
    }
    .hsb-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid #e6e8ee;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #0e0f12;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Слова, собранные в строгую сетку и превращающиеся в точки"></main>
  <button id="controlsToggle" type="button" aria-label="Показать или скрыть панель управления">☰</button>

  <div id="controls">
    <div class="control-group">
      <div class="group-title">жизнь</div>
      <div class="group-body">
        <div class="group-row" id="vizGroup">
          <label>плотность точек
            <input id="density" type="range" min="0" max="100" value="60" />
            <span class="control-value" id="densityValue">60</span>
          </label>
          <label>скорость движения
            <input id="speed" type="range" min="0" max="200" value="100" />
            <span class="control-value" id="speedValue">100</span>
          </label>
          <label>вихрь
            <input id="vortex" type="range" min="0" max="100" value="100" />
            <span class="control-value" id="vortexValue">100</span>
          </label>
          <label>сфера
            <input id="sphere" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="sphereValue">0</span>
          </label>
          <label>удаленность
            <input id="distance" type="range" min="0" max="100" value="100" />
            <span class="control-value" id="distanceValue">100</span>
          </label>
          <label>связность
            <input id="cohesion" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="cohesionValue">0</span>
          </label>
          <label>количество линий
            <input id="links" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="linksValue">0</span>
          </label>
          <label>свечение
            <input id="glow" type="range" min="0" max="100" value="45" />
            <span class="control-value" id="glowValue">45</span>
          </label>
          <label>шлейф
            <input id="trail" type="range" min="0" max="100" value="10" />
            <span class="control-value" id="trailValue">10</span>
          </label>
          <label class="hsb-control">HSB облака
            <span id="hsbWheel" class="hsb-wheel" role="slider" aria-label="Оттенок и насыщенность облака точек">
              <span id="hsbDot" class="hsb-dot"></span>
            </span>
          </label>
          <label>чувствительность HSB
            <input id="hsbMix" type="range" min="0" max="100" value="0" />
            <span class="control-value" id="hsbMixValue">0</span>
          </label>
        </div>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">звёзды</div>
      <div class="group-row">
        <label>звёзды вкл
          <input id="starEnabled" type="checkbox" checked />
        </label>
        <label>скорость звёзд
          <input id="starSpeed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starSpeedValue">0</span>
        </label>
        <label>контраст звёзд
          <input id="starContrast" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starContrastValue">0</span>
        </label>
        <label>яркость звёзд
          <input id="starBrightness" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starBrightnessValue">0</span>
        </label>
        <label>вращение звёзд
          <input id="starSpin" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starSpinValue">0</span>
        </label>
        <label>движение вперёд
          <input id="starForward" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="starForwardValue">0</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">синяя планета</div>
      <div class="group-row">
        <label>масса планеты
          <input id="planetMass" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planetMassValue">0</span>
        </label>
        <label>скорость вращения
          <input id="planetSpeed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planetSpeedValue">0</span>
        </label>
        <label>орбита
          <input id="planetDistance" type="range" min="0" max="100" value="80" />
          <span class="control-value" id="planetDistanceValue">80</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">красная планета</div>
      <div class="group-row">
        <label>масса планеты
          <input id="planet2Mass" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planet2MassValue">0</span>
        </label>
        <label>скорость вращения
          <input id="planet2Speed" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="planet2SpeedValue">0</span>
        </label>
        <label>орбита
          <input id="planet2Distance" type="range" min="0" max="100" value="80" />
          <span class="control-value" id="planet2DistanceValue">80</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">точка вращения</div>
      <div class="group-row">
        <label>притяжение
          <input id="sunAttraction" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="sunAttractionValue">0</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">звук</div>
      <div class="group-row">
        <button id="soundToggle" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="soundToggleLabel">звук: выкл</span>
        </button>
        <label>громкость
          <input id="volume" type="range" min="0" max="100" value="50" />
          <span class="control-value" id="volumeValue" data-suffix="%">50%</span>
        </label>
        <label>частота
          <input id="frequency" type="range" min="0" max="100" value="15" />
          <span class="control-value" id="frequencyValue" data-suffix="%">15%</span>
        </label>
        <label>дилей
          <input id="delay" type="range" min="0" max="100" value="60" />
          <span class="control-value" id="delayValue" data-suffix="%">60%</span>
        </label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-title">присутствие</div>
      <div class="group-row">
        <label>чувствительность
          <input id="presence" type="range" min="0" max="100" value="0" />
          <span class="control-value" id="presenceValue">0</span>
        </label>
        <button id="presenceToggle" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="presenceToggleLabel">микрофон: выкл</span>
        </button>
      </div>
    </div>
    <div class="control-group" id="midiGroup">
      <div class="group-title">MIDI-контроллер (Akai MPK25)</div>
      <div class="group-row">
        <button id="midiConnectBtn" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="midiConnectLabel">MIDI: выкл</span>
        </button>
        <button id="midiLearnBtn" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span id="midiLearnLabel">Learn: выкл</span>
        </button>
        <button id="midiResetBtn" type="button" class="mic-toggle" aria-pressed="false">
          <span class="mic-toggle-dot"></span>
          <span>Сбросить MIDI</span>
        </button>
        <div class="midi-hint" id="midiHint">Нажми «Подключить MIDI», затем «Learn», выбери ползунок или кнопку на экране и покрути ручку либо нажми пэд на контроллере.</div>
      </div>
    </div>
    <div class="chaos-frame">
      <button id="chaosBtn" type="button" class="chaos-btn">Хаос</button>
    </div>
  </div>

    // ===================== MIDI: Akai MPK25 и любой Web MIDI контроллер =====================
    // Режим "Learn": жмём Learn -> кликаем по ползунку/чекбоксу/кнопке на экране ->
    // крутим ручку или жмём пэд на контроллере - связка запоминается в localStorage.
    // Банки ручек на самом MPK25 (A/B/C/D) переключают номера CC у одних и тех же
    // физических ручек - так можно привязать больше 8 ползунков, просто переключая
    // банк на контроллере и заново привязывая нужные ручки через Learn.
    const MIDI_STORAGE_KEY = 'birthMidiMap_v1';
    const MIDI_ACTIONS = {
      chaosBtn: () => document.getElementById('chaosBtn')?.click(),
      presenceToggle: () => document.getElementById('presenceToggle')?.click(),
      soundToggle: () => document.getElementById('soundToggle')?.click(),
      controlsToggle: () => document.getElementById('controlsToggle')?.click()
    };
    const MIDI_ACTION_NAMES = {
      chaosBtn: 'Хаос',
      presenceToggle: 'микрофон вкл/выкл',
      soundToggle: 'звук вкл/выкл',
      controlsToggle: 'показать/скрыть панель'
    };
    let midiAccess = null;
    let midiLearnMode = false;
    let midiArmedTarget = null;
    let midiMap = {};
    let midiCcEdgeState = {};
    let midiHintEl = null;

    function midiLoadMap() {
      try {
        const raw = localStorage.getItem(MIDI_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (err) {
        return {};
      }
    }

    function midiSaveMap() {
      try {
        localStorage.setItem(MIDI_STORAGE_KEY, JSON.stringify(midiMap));
      } catch (err) {
        // хранилище недоступно - привязки просто не переживут перезагрузку страницы
      }
    }

    function midiFindLearnable(el) {
      if (!el || !el.closest) return null;
      const label = el.closest('#controls label');
      if (label) {
        const input = label.querySelector('input[type="range"], input[type="checkbox"]');
        if (input && input.id) return { kind: 'range', id: input.id, input };
      }
      const actionEl = el.closest('#chaosBtn, #presenceToggle, #soundToggle, #controlsToggle');
      if (actionEl && MIDI_ACTIONS[actionEl.id]) {
        return { kind: 'action', id: actionEl.id, input: actionEl };
      }
      return null;
    }

    function midiDescribeTarget(target) {
      if (!target) return '';
      if (target.kind === 'action') return MIDI_ACTION_NAMES[target.id] || target.id;
      const label = target.input && target.input.closest ? target.input.closest('label') : null;
      if (label) {
        const text = Array.from(label.childNodes)
          .filter(node => node.nodeType === 3)
          .map(node => node.textContent.trim())
          .join(' ')
          .trim();
        if (text) return text;
      }
      return target.id;
    }

    function midiSetArmed(target, on) {
      if (!target || !target.input) return;
      const el = target.kind === 'range' ? (target.input.closest('label') || target.input) : target.input;
      el.classList.toggle('midi-armed', on);
    }

    function midiFlash(el) {
      if (!el) return;
      el.classList.add('midi-live');
      clearTimeout(el._midiFlashTimer);
      el._midiFlashTimer = setTimeout(() => el.classList.remove('midi-live'), 180);
    }

    function midiApplyValue(binding, value, source) {
      if (!binding) return;
      if (binding.kind === 'range') {
        const input = document.getElementById(binding.id);
        if (!input) return;
        if (input.type === 'checkbox') {
          input.checked = value >= 64;
        } else {
          const min = Number(input.min);
          const max = Number(input.max);
          input.value = String(min + (value / 127) * (max - min));
        }
        midiFlash(input.closest('label') || input);
        return;
      }
      if (binding.kind === 'action') {
        if (source === 'note') {
          MIDI_ACTIONS[binding.id]?.();
          midiFlash(document.getElementById(binding.id));
          return;
        }
        // CC на кнопке: срабатывает один раз при переходе через середину хода
        // ручки, чтобы не щёлкать по многу раз, пока ручку крутят.
        const prev = midiCcEdgeState[binding.id] || 0;
        if (value >= 64 && prev < 64) {
          MIDI_ACTIONS[binding.id]?.();
          midiFlash(document.getElementById(binding.id));
        }
        midiCcEdgeState[binding.id] = value;
      }
    }

    function midiOnEvent(source, num, value) {
      const key = source + ':' + num;
      if (midiLearnMode && midiArmedTarget) {
        const target = midiArmedTarget;
        midiMap[key] = { kind: target.kind, id: target.id };
        midiSaveMap();
        midiSetArmed(target, false);
        midiArmedTarget = null;
        if (midiHintEl) {
          midiHintEl.textContent = midiDescribeTarget(target) + ' <- ' +
            (source === 'cc' ? 'ручка, CC ' : 'пэд, нота ') + num +
            '. Выбери следующий элемент или выключи Learn.';
        }
        return;
      }
      midiApplyValue(midiMap[key], value, source);
    }

    function midiOnMessage(event) {
      const data = event.data;
      if (!data || data.length < 2) return;
      const status = data[0];
      const type = status & 0xf0;
      if (type === 0xb0) {
        midiOnEvent('cc', data[1], data[2] || 0);
      } else if (type === 0x90 && (data[2] || 0) > 0) {
        midiOnEvent('note', data[1], data[2]);
      }
    }

    function midiAttachInputs(connectBtn, connectLabel) {
      if (!midiAccess) return;
      const names = [];
      for (const input of midiAccess.inputs.values()) {
        input.onmidimessage = midiOnMessage;
        names.push(input.name || 'MIDI-устройство');
      }
      if (names.length === 0) {
        if (connectLabel) connectLabel.textContent = 'MIDI: контроллер не найден';
        connectBtn.classList.remove('live');
        connectBtn.setAttribute('aria-pressed', 'false');
        return;
      }
      const mpk = names.find(name => /mpk/i.test(name));
      if (connectLabel) connectLabel.textContent = 'MIDI: ' + (mpk || names.join(', '));
      connectBtn.classList.add('live');
      connectBtn.setAttribute('aria-pressed', 'true');
    }

    function setupMidiControl() {
      const connectBtn = document.getElementById('midiConnectBtn');
      const connectLabel = document.getElementById('midiConnectLabel');
      const learnBtn = document.getElementById('midiLearnBtn');
      const learnLabel = document.getElementById('midiLearnLabel');
      const resetBtn = document.getElementById('midiResetBtn');
      midiHintEl = document.getElementById('midiHint');
      if (!connectBtn || !learnBtn || !resetBtn) return;

      midiMap = midiLoadMap();

      connectBtn.addEventListener('click', async () => {
        if (!navigator.requestMIDIAccess) {
          if (connectLabel) connectLabel.textContent = 'MIDI: браузер не поддерживает';
          return;
        }
        try {
          midiAccess = await navigator.requestMIDIAccess({ sysex: false });
          midiAttachInputs(connectBtn, connectLabel);
          midiAccess.onstatechange = () => midiAttachInputs(connectBtn, connectLabel);
        } catch (err) {
          if (connectLabel) connectLabel.textContent = 'MIDI: доступ запрещён';
        }
      });

      learnBtn.addEventListener('click', () => {
        midiLearnMode = !midiLearnMode;
        document.body.classList.toggle('midi-learning', midiLearnMode);
        learnBtn.classList.toggle('live', midiLearnMode);
        learnBtn.setAttribute('aria-pressed', midiLearnMode ? 'true' : 'false');
        if (learnLabel) learnLabel.textContent = midiLearnMode ? 'Learn: вкл' : 'Learn: выкл';
        if (!midiLearnMode && midiArmedTarget) {
          midiSetArmed(midiArmedTarget, false);
          midiArmedTarget = null;
        }
        if (midiHintEl) {
          midiHintEl.textContent = midiLearnMode
            ? 'Клик по ползунку, чекбоксу или кнопке на экране - затем крути ручку или жми пэд на контроллере.'
            : 'Нажми «Подключить MIDI», затем «Learn», выбери элемент и покрути ручку/нажми пэд на Akai MPK25.';
        }
      });

      resetBtn.addEventListener('click', () => {
        midiMap = {};
        midiCcEdgeState = {};
        midiSaveMap();
        if (midiHintEl) midiHintEl.textContent = 'Все привязки MIDI сброшены.';
      });

      document.addEventListener('click', event => {
        if (!midiLearnMode) return;
        const target = midiFindLearnable(event.target);
        if (!target) return;
        event.preventDefault();
        event.stopPropagation();
        if (midiArmedTarget) midiSetArmed(midiArmedTarget, false);
        midiArmedTarget = target;
        midiSetArmed(midiArmedTarget, true);
        if (midiHintEl) midiHintEl.textContent = 'Ждём сигнал для «' + midiDescribeTarget(target) + '»...';
      }, true);
    }

// ===================== Производительность: под конкретную машину =====================
    // Канву 2D браузер не раскладывает по ядрам процессора, поэтому главное
    // ускорение сделано иначе: все точки (шлейф, свечение, ядро) рисует
    // видеокарта через WebGL-слой поверх p5-канвы (см. «Точки на видеокарте»).
    // Сама p5-канва (звёзды, планеты, линии) всегда в x1: её разгон до x2
    // вчетверо утяжелял кадр и раскачивал fps между 30 и 20.
    // Автомасштаб ниже меняет только чёткость слоя точек — это дёшево.
    const PERF_SAMPLE_MS = 1000;
    const PERF_LOW_FPS = 26;
    const PERF_HIGH_FPS = 29;
    let perfWindowFrames = 0;

    // Потолок чёткости слоя точек: не выше плотности пикселей экрана и не
    // выше того, что прикидываем по ядрам и памяти машины.
    function detectPerfCeiling() {
      const cores = navigator.hardwareConcurrency || 4;
      const mem = navigator.deviceMemory || 4; // ГБ; есть только в Chrome/Edge
      const screenDensity = window.devicePixelRatio || 1;
      let ceiling = 1;
      if (cores >= 8 && mem >= 8) ceiling = 2;
      else if (cores >= 4) ceiling = 1.5;
      return Math.max(1, Math.min(ceiling, screenDensity));
    }

    // Раз в секунду считает средний FPS за эту секунду (а не по одному
    // кадру, как frameRate()). Держится ниже 26 - чёткость слоя точек
    // снижается на шаг; держится 29+ - возвращается к потолку.
    function updatePerfScaling() {
      perfWindowFrames++;
      const now = millis();
      const elapsed = now - perfWindowStart;
      if (elapsed < PERF_SAMPLE_MS) return;
      perfCurrentFps = (perfWindowFrames * 1000) / elapsed;
      perfWindowStart = now;
      perfWindowFrames = 0;
      if (!pointsLayer) return; // без WebGL p5-канва остаётся в x1

      if (perfCurrentFps < PERF_LOW_FPS) {
        perfHighStreak = 0;
        perfLowStreak++;
        if (perfLowStreak >= 2 && perfPixelDensity > 1) {
          perfPixelDensity = Math.max(1, perfPixelDensity - 0.25);
          perfLowStreak = 0;
        }
      } else if (perfCurrentFps >= PERF_HIGH_FPS) {
        perfLowStreak = 0;
        perfHighStreak++;
        if (perfHighStreak >= 3 && perfPixelDensity < perfPixelDensityCeiling) {
          perfPixelDensity = Math.min(perfPixelDensityCeiling, perfPixelDensity + 0.25);
          perfHighStreak = 0;
        }
      } else {
        perfLowStreak = 0;
        perfHighStreak = 0;
      }
    }

    // Средний FPS, чёткость слоя точек и способ отрисовки (GL - видеокарта,
    // 2D - запасной путь без WebGL) в правом верхнем углу.
    function drawPerfHud() {
      push();
      noStroke();
      fill(138, 143, 153, 210);
      textAlign(RIGHT, TOP);
      textSize(12);
      text('FPS ' + Math.round(perfCurrentFps) + ' \u00b7 x' + perfPixelDensity.toFixed(2) +
        (pointsLayer ? ' \u00b7 GL' : ' \u00b7 2D'), width - 14, 14);
      pop();
    }
